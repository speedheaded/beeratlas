va nepotvrzené","How Czech lager is made →":"Jak se vaří český ležák →","The name on the front. You can type it; having the camera read it needs a server.":"Název na přední straně. Můžete ho napsat; aby ho přečetla kamera, je potřeba server.","Or read the front and type it":"Nebo si přečtěte přední stranu a napište to","Whatever is written largest on the label will do — the brewery name usually is. This searches what the atlas already holds, with nothing sent anywhere, and answers even when the bottle has no barcode we know.":"Stačí to, co je na etiketě napsané největším písmem — obvykle jméno pivovaru. Hledá se v tom, co atlas už má, nikam se nic neposílá, a odpověď přijde i u láhve, jejíž čárový kód neznáme.","Svijany, Kozel, Únětický…":"Svijany, Kozel, Únětický…","Nothing in the atlas reads like that. Try the brewery name instead — it is usually the biggest word on the label.":"Nic takového v atlasu není. Zkuste jméno pivovaru — bývá na etiketě největší.","full page":"celá stránka","catalogue line":"řádek katalogu","unconfirmed mark":"nepotvrzená značka","We have not confirmed this as a brewery — it is a name on a tap, and nothing more. But we know who puts it there, and that is still an answer:":"Jako pivovar jsme to nepotvrdili — je to jméno na pípě a nic víc. Víme ale, kdo ho tam dal, a to je pořád odpověď:","Scan a bottle":"Načíst láhev","Photograph the bottle":"Vyfoťte láhev","A bottle in your hand is the anchor":"Láhev v ruce je ta kotva","You do not have to remember a beer name. The barcode is read by the phone itself — locally, with no model and no server behind it — and the atlas answers from there. When the barcode misses, it steps down until it can still say where to drink the beer.":"Nemusíte si vzpomínat na název piva. Čárový kód přečte sám telefon — u vás, bez modelu a bez serveru — a atlas odpovídá odtud. Když kód mine, sestoupí o stupeň níž, dokud pořád ještě dokáže říct, kde to pivo vypít.","Read the barcode":"Načíst čárový kód","or type the digits":"nebo opište číslice","Look up":"Najít","The barcode is on the back of the bottle — turn it round. That one the prototype reads for real. The front, with the name on it, is the next rung, and that one needs a server: here it is shown, not done.":"Čárový kód je na zadní straně láhve — otočte ji. Ten prototyp čte doopravdy. Přední strana s názvem je další stupeň, a na ten je potřeba server: tady je ukázaný, ne provedený.","Or take one of these ten":"Nebo si vezměte jednu z těchhle deseti","Real barcodes of bottles sold in Czech shops, chosen to land on each of the four rungs — including the two that miss.":"Skutečné čárové kódy lahví, které se v Česku prodávají, vybrané tak, aby dopadly na každý ze čtyř stupňů — včetně dvou, které minou.","Barcode":"Čárový kód","Read by the phone itself. Exact when it hits.":"Přečte ho sám telefon. Když trefí, tak přesně.","Label":"Etiketa","Reading the name off the label. Needs a server — not built yet.":"Přečíst název z etikety. Je na to potřeba server — zatím nepostavené.","Beer unknown, brewery known. Enough to say where it is poured.":"Pivo neznáme, pivovar ano. To stačí na odpověď, kde se čepuje.","Anchor":"Kotva","Nothing known. We take what the label says into the finder.":"Nevíme nic. Co se dá vyčíst, bereme do hledání.","Not a barcode we know":"Tenhle kód neznáme","The atlas holds 139 Czech bottles with a barcode. This is not one of them — which is the honest answer, not a failure of the phone.":"Atlas má 139 českých lahví s čárovým kódem. Tahle mezi nimi není — a to je poctivá odpověď, ne selhání telefonu.","Matched. There is a full page: how it is made, how it differs from a beer you know, and where to drink it.":"Trefa. Je k tomu celá stránka: jak se to vaří, čím se to liší od piva, které znáte, a kde to vypít.","Open the beer":"Otevřít pivo","Matched a catalogue line. We know the numbers, the brewery and where to drink it. We have not tasted it, so there is no description.":"Trefa do řádku katalogu. Známe čísla, pivovar i to, kde ho vypít. Neochutnali jsme ho, takže tu není popis.","Open the line":"Otevřít řádek","This exact beer is not in the atlas. The brewery is, and that answers the question you actually asked: where it is poured in Prague.":"Tohle konkrétní pivo v atlasu není. Pivovar ano, a to odpovídá na otázku, kterou jste doopravdy položili: kde se čepuje v Praze.","Where the brewery is poured":"Kde se pivovar čepuje","Not in the atlas":"V atlasu není","Here is everything the barcode gave us:":"Tohle je všechno, co nám čárový kód dal:","No Prague venue in our data pours it. Rather than invent a page, we hand you to the finder with what we read.":"Žádný pražský podnik v našich datech ho nečepuje. Místo vymýšlení stránky vás pošleme do hledání s tím, co jsme přečetli.","This browser cannot read barcodes. Type the digits instead.":"Tenhle prohlížeč čárové kódy neumí. Opište číslice.","No camera here. Type the digits under the barcode instead.":"Kamera tu není. Opište číslice pod čárovým kódem.","Point the camera at the barcode.":"Namiřte kameru na čárový kód.","Barcode read:":"Přečteno:","district not in source":"část ve zdroji není","no street":"bez ulice","Plato":"Plato","no gravity in source":"stupňovitost ve zdroji není","Marks we have not confirmed":"Značky, které jsme nepotvrdili","A Prague venue names these on its taps, and that is all we know. No entry in Wikidata, no lineup on a site of their own. Some are real breweries we have not caught up with; some are a brand, a parent company, or the name of a single beer. Until one of those is settled they get no page here, because a page would assert something we cannot back.":"Nějaký pražský podnik je uvádí na pípě, a to je všechno, co víme. Ani záznam ve Wikidatech, ani sortiment na vlastních stránkách. Některé jsou opravdové pivovary, ke kterým jsme se zatím nedostali; jiné jsou značka, mateřská firma nebo název jednoho piva. Dokud to není jasné, stránku tu nedostanou — stránka by tvrdila něco, co nemáme čím podložit.","named at":"uvádí","Know one of these? A brewery's own page listing its beers is enough to move it up.":"Znáte některou z nich? Stačí vlastní stránka pivovaru se seznamem piv a posuneme ji nahoru.","also lists":"uvádí také","not confirmed as breweries":"jako pivovary nepotvrzeno","Venue data © OpenStreetMap contributors, ODbL":"Data podniků © přispěvatelé OpenStreetMap, ODbL","bottle data and label photographs © Open Food Facts contributors, ODbL":"data o lahvích a fotografie etiket © přispěvatelé Open Food Facts, ODbL","brewery data from Wikidata, CC0":"data o pivovarech z Wikidat, CC0","beer parameters read from the breweries' own pages, each with its source":"parametry piv sejmuté z vlastních stránek pivovarů, u každého je zdroj","collected":"sebráno","Also brewed":"Ještě vaří","These we know about but have not described. The numbers come from the brewery, with the page they were read from.":"O těchhle víme, ale nepopsali jsme je. Čísla jsou od pivovaru, i s adresou stránky, ze které jsou vzatá.","We know this beer is brewed and where to drink it. We have not tasted it, so there is no description here and it does not take part in the anchor match. That is the honest state, not an oversight.":"Víme, že se tohle pivo vaří, a víme, kde ho vypít. Neochutnali jsme ho, takže tu není popis a neúčastní se hledání podle kotvy. Tak to poctivě je, není to opomenutí.","Where the numbers come from":"Odkud jsou ta čísla","source →":"zdroj →","Known, not yet described":"Známe, ale nepopsali jsme","Read off the brewery's own pages and off labels, with the source kept. No tasting notes, so they stay out of the anchor match until someone drinks them.":"Sejmuto z vlastních stránek pivovarů a z etiket, se zachovaným zdrojem. Bez chuťového popisu, takže do hledání podle kotvy nevstupují, dokud je někdo nevypije.","open around the clock":"otevřeno nonstop","closed today":"dnes zavřeno","today from %s":"dnes od %s","today %s":"dnes %s","%s Czech beers":"%s českých piv","about the same":"zhruba stejné","%s with a Prague venue":"%s s pražským podnikem","%s pubs with a phone":"%s hospod s telefonem","and %s more":"a dalších %s","not Czech":"není české","not in Wikidata":"není ve Wikidatech","Brewery site:":"Web pivovaru:","%s pubs with a phone number":"%s hospod s telefonním číslem","Of %s named Prague pubs and bars in OpenStreetMap. This list is the September call sheet — one question: will ten of us fit on a Thursday.":"Z %s pojmenovaných pražských hospod a barů v OpenStreetMap. Tenhle seznam je zářijový obvolávací arch — jedna otázka: vejde se nás tam ve čtvrtek deset?","Showing 120 of %s.":"Zobrazeno 120 z %s.","Grain to glass":"Od zrna do sklenice","Unless marked %s, everything below is known for this brewery.":"Pokud není označeno %s, všechno níže je pro tenhle pivovar potvrzené.","Unless marked %s, everything below is what beers of this style normally do, and is not confirmed for this beer.":"Pokud není označeno %s, všechno níže je to, co piva tohohle stylu obvykle dělají, a u tohohle piva to potvrzené není.","Everything below is known for this brewery.":"Všechno níže je pro tenhle pivovar potvrzené.","Nothing below is confirmed for this beer — it is what beers of this style normally do.":"Níže není u tohohle piva potvrzené nic — je to popis toho, co piva tohohle stylu obvykle dělají.","The three figures at the top are computed from this beer's own gravity and strength. Where we do not know what a brewery does, we say what the style normally does rather than invent a mash schedule.":"Tři čísla nahoře jsou spočítaná ze stupňovitosti a alkoholu tohohle piva. Když nevíme, co dělá konkrétní pivovar, řekneme, co obvykle dělá styl — místo abychom si vymysleli rmutovací schéma.","Everything above is confirmed for this brewery.":"Všechno výše je pro tenhle pivovar potvrzené.","Start from a beer you know":"Začněte od piva, které znáte","1 · A beer you know":"1 · Pivo, které znáte","2 · But make it":"2 · Ale chtěli byste","Reset all":"Vynulovat","Closest, and where to drink it":"Nejbližší, a kde to vypít","Weighting is deliberate.":"Vážení je záměrné.","Breweries poured in Prague":"Pivovary čepované v Praze","From Wikidata, joined to OpenStreetMap venue tags. Strokes count the venues.":"Z Wikidat, spojeno s tagy podniků v OpenStreetMap. Čárky počítají podniky.","The range":"Sortiment","Poured in Prague":"Čepuje se v Praze","no phone":"bez telefonu","Brewery level, not SKU.":"Na úrovni pivovaru, ne konkrétního piva.","Source":"Zdroj","Wikidata":"Wikidata","Founded":"Založeno","City":"Město","Prague venues":"Podniků v Praze","Official site":"Oficiální web","not in source":"ve zdroji není","Nothing matches.":"Nic neodpovídá.","Corrections":"Opravy","If we got your beer wrong":"Když jsme vaše pivo popsali špatně","What we most likely have wrong":"Co máme nejspíš špatně","What happens to a correction":"Co se s opravou stane","or unverified to":"nebo neověřené na","What we will not do":"Co neuděláme","Not built yet":"Zatím nepostavené","style":"styl","brewery":"pivovar","How Czech lager is made":"Jak se vaří český ležák","Why it matters":"Proč na tom záleží","See a beer →":"Podívat se na pivo →","Three ways to have it poured":"Tři způsoby, jak si nechat natočit","Ask by name and you will be served like a regular, not like a tourist.":"Řekněte si jménem a obslouží vás jako štamgasta, ne jako turistu.","Hladinka":"Hladinka","Šnyt":"Šnyt","The default. Three fingers of dense foam over full beer. Say nothing and this is what arrives.":"Výchozí volba. Tři prsty husté pěny nad plným pivem. Když nic neřeknete, přijde tohle.","Less beer, more foam, same glass. For when you want one more but not a whole one. Costs less.":"Míň piva, víc pěny, stejná sklenice. Když chcete ještě jedno, ale ne celé. Stojí míň.","Almost all foam — sweet, creamy, drunk in one go at the end. Not a mistake by the bartender.":"Skoro samá pěna — sladká, krémová, pije se na konci naráz. Není to omyl výčepního.","Say it out loud":"Řekněte to nahlas","Jedno dvanáctku, prosím":"Jedno dvanáctku, prosím","yed-no dva-NATS-ku, pro-seem":"výslovnost pro cizince: yed-no dva-NATS-ku, pro-seem","One 12°, please":"Jedna dvanáctka","Ještě jedno":"Ještě jedno","yesh-tye yed-no":"výslovnost pro cizince: yesh-tye yed-no","One more":"Ještě jedno pivo","The number on the menu is malt, not alcohol. A 12° is about 4.4 %.":"Číslo na lístku je slad, ne alkohol. Dvanáctka má okolo 4,4 %.","Read the style page →":"Přečíst o stylu →","Beer parameters and descriptions are unverified working content for this mockup, not published facts.":"Parametry a texty piv jsou neověřený pracovní obsah pro tento prototyp, ne publikovaná fakta.","the brewery's own site":"vlastní stránky pivovaru","Open Food Facts, ODbL":"Open Food Facts, ODbL","Nobody can answer &ldquo;dryness, 1 to 10&rdquo;. So the atlas never asks. Pick a beer\n          you know — Urquell, Guinness, Corona — and push it: less bitter, darker, fuller.":"Na otázku „suchost, 1 až 10“ nikdo neodpoví. Atlas se tak neptá. Vyberte pivo, které znáte — Prazdroj, Guinness, Corona — a posuňte ho: míň hořké, tmavší, plnější.","A beer you cannot find is trivia. Each page finishes with Prague venues that carry the\n          brewery, their phone number and their hours.":"Pivo, které nemůžete sehnat, je jen zajímavost. Každá stránka končí pražskými podniky, které daný pivovar čepují, jejich telefonem a otevírací dobou.","We promise the brewery, not the tap. Which of its beers is on tonight is a question for\n          the bar, and we say so rather than guess.":"Slibujeme pivovar, ne pípu. Které z jeho piv je dnes večer na čepu, je otázka na hospodu, a my to raději řekneme, než abychom hádali.","Decoction mashing, open fermenters, six weeks cold in a horizontal tank. Not trivia —\n          it is why the beer in front of you tastes the way it does.":"Rmutování, otevřené spilky, šest týdnů v chladu ve vodorovném tanku. Ne zajímavost — je to důvod, proč pivo před vámi chutná tak, jak chutná.","Each page works out how much of the wort actually fermented, which is the difference\n          between a beer that drinks light and one that drinks full.":"Každá stránka spočítá, kolik mladiny doopravdy prokvasilo, a v tom je rozdíl mezi pivem, které se pije lehce, a tím, které se pije plně.","Most beer sites state a number and move on. Ours shows its hand: every value carries how we\n        got it. Read from a label, seen in the pub, asked by phone, or":"Většina pivních webů uvede číslo a jde dál. Náš ukazuje karty: u každé hodnoty je, jak jsme k ní přišli. Z etikety, viděno v hospodě, zjištěno telefonem, nebo","— and estimates are drawn dotted and muted so you can tell at a glance.":"— a odhady jsou tečkované a ztlumené, aby se poznaly na první pohled.",", not by\n        good intentions. A reader who catches one invented number stops believing the whole page,\n        and they are right to.":", ne dobrým úmyslem. Čtenář, který přistihne jedno vymyšlené číslo, přestane věřit celé stránce, a má pravdu.","No scores out of five, no leaderboard of the worst Czech beer. Breweries are people we\n          want to talk to, not targets.":"Žádné známky z pěti, žádný žebříček nejhoršího českého piva. Pivovary jsou lidé, se kterými chceme mluvit, ne terče.","Nothing is for sale here. Beer is heavy, excise duty is paid in the country it lands in,\n          and a bottle posted across Europe costs more than the beer.":"Nic tu není na prodej. Pivo je těžké, spotřební daň se platí v zemi určení a láhev poslaná přes Evropu stojí víc než pivo samo.","We do not average strangers' opinions. We describe how a beer differs from one you have\n          had, and let you decide.":"Neprůměrujeme názory cizích lidí. Popisujeme, čím se pivo liší od toho, které jste už pili, a rozhodnutí necháváme vám.","Everything above is built from two free sources — OpenStreetMap for the venues,\n      Wikidata for the breweries — plus beer data typed for this demo and marked unverified\n      throughout.":"Všechno výše je postavené ze dvou volných zdrojů — OpenStreetMap pro podniky, Wikidata pro pivovary — plus data o pivech napsaná pro tento prototyp a všude označená jako neověřená.","Degrees on a Czech menu are degrees Plato — how much malt sugar was in the wort before\n          fermentation. Roughly, the alcohol lands near a third of the number: a 10° is about 3.8 %,\n          a 12° about 4.4 %.":"Stupně na českém lístku jsou stupně Plato — kolik sladového cukru bylo v mladině před kvašením. Zhruba platí, že alkohol vyjde okolo třetiny toho čísla: desítka má asi 3,8 %, dvanáctka okolo 4,4 %.","No open source carries it — it has to be seen in the pub and dated. That column, and\n            &ldquo;will ten of us fit&rdquo;, are what the September phone survey collects.":"Žádný volný zdroj ji nemá — musí se vidět v hospodě a opatřit datem. Právě tenhle sloupec a „vejde se nás tam deset?“ sbírá zářijový telefonický průzkum.","No Prague venue in OpenStreetMap carries this brewery yet. Under the\n            publishing rule this beer would live as a line on the brewery page, not as a page of\n            its own.":"Zatím žádný pražský podnik v OpenStreetMap tenhle pivovar nečepuje. Podle pravidla publikace by tohle pivo žilo jako řádek na stránce pivovaru, ne jako vlastní stránka.","— typed from knowledge for this\n              demo, not read off a label. Before launch each is confirmed or deleted.":"— napsaná ze znalosti pro tento prototyp, ne opsaná z etikety. Před spuštěním se každá potvrdí, nebo smaže.","A stroke is how a Czech waiter counts what you have drunk. Yours stay in\n            this browser — the shared count starts when the site is live.":"Čárka je způsob, jakým český výčepní počítá, co jste vypili. Vaše zůstávají v tomhle prohlížeči — společné počítání začne, až bude web živý.",": it only sharpens what the atlas\n            suggests you next.":": jen to zpřesňuje, co vám atlas navrhne příště.","Nobody can answer &ldquo;dryness, 1 to 10&rdquo;. Everybody can name\n      a beer they have had. Pick one, push it around, and the atlas walks the graph to what is\n      poured in Prague.":"Na otázku „suchost, 1 až 10“ nikdo neodpoví. Ale pivo, které pil, umí jmenovat každý. Vyberte jedno, posuňte ho, a atlas projde grafem k tomu, co se čepuje v Praze.","Axes you actually moved count for more than the\n      ones you left alone — asking for less bitterness makes a bitterness miss cost more. The match\n      is plain arithmetic, not a model: same input, same answer, every time, and it cannot invent\n      a taste claim.":"Osy, se kterými jste opravdu hnuli, váží víc než ty, které jste nechali být — když si řeknete o menší hořkost, promáchnutí v hořkosti stojí víc. Shoda je čistá aritmetika, ne model: stejný vstup, stejná odpověď, pokaždé, a nemůže si vymyslet tvrzení o chuti.","Every one belongs to a brewery with at least one Prague venue. That is the\n      publishing rule: no venue, no page.":"Každé patří pivovaru, který má aspoň jeden pražský podnik. To je pravidlo publikace: bez podniku není stránka.","These venues carry this brewery. Which beer is\n        on the tap tonight is a different question, and open data cannot answer it.":"Tyhle podniky vedou tenhle pivovar. Které z jeho piv je dnes na čepu, je jiná otázka a otevřená data na ni neodpovědí.","Most numbers on this site are marked unverified, and we\n      would rather be corrected than be polite about it. If you brew the beer, you outrank us.":"Většina čísel na tomhle webu je označená jako neověřená a raději se necháme opravit, než abychom byli zdvořilí. Kdo pivo vaří, má nad námi navrch.","Original gravity and alcohol, taken from knowledge rather than from your label. Whether\n        the beer is filtered, pasteurised, or neither. Mash schedule, fermentation vessel and\n        lagering time — anything marked":"Stupňovitost a alkohol, vzaté ze znalosti místo z vaší etikety. Jestli je pivo filtrované, pasterizované, nebo ani jedno. Postup rmutování, kvasná nádoba a doba ležení — cokoli označeného jako","is a guess about your\n        category, not about you.":"je odhad o vaší kategorii, ne o vás.","It goes into a review queue, not straight onto the page. Once applied, the value changes\n        from":"Půjde do fronty ke kontrole, ne rovnou na stránku. Po zapracování se hodnota změní z",",\n        carries your name as the source and the date it was confirmed. Nothing is published in your\n        name that you did not send us.":", ponese vaše jméno jako zdroj a datum potvrzení. Nic se ve vašem jménu nezveřejní, co jste nám neposlali.","We will not remove an honest description because it is unflattering, and we will not\n        publish marketing copy. Facts about your beer are yours; the opinion about how it tastes\n        stays ours.":"Nesmažeme poctivý popis proto, že je nelichotivý, a nezveřejníme marketingový text. Fakta o vašem pivu jsou vaše; názor na to, jak chutná, zůstává náš.","This page describes the\n        intended flow. In the mockup there is no form behind it — the first fifty corrections will\n        arrive by email and live in a spreadsheet, which is the right amount of software for fifty\n        of anything.":"Tahle stránka popisuje zamýšlený postup. V prototypu za ní není formulář — prvních padesát oprav přijde e-mailem a bude bydlet v tabulce, což je správné množství softwaru na padesát čehokoli.","The same seven steps stand behind almost every beer on\n      this site. What changes from brewery to brewery is how long each one is allowed to take.":"Za skoro každým pivem na tomhle webu stojí týchž sedm kroků. Co se pivovar od pivovaru mění, je to, kolik času každý z nich dostane.","Decoction mashing and\n        a month of cold lagering are expensive. They are also the whole reason Czech lager tastes\n        the way it does, and the first thing an industrial process cuts.":"Rmutování a měsíc studeného ležení jsou drahé. Jsou také celý důvod, proč český ležák chutná tak, jak chutná, a první věc, function num(n, en1, en2, cs1, cs2, cs5){

}

/* Часы в OpenStreetMap записаны машинным синтаксисом: "Mo-We 11:00-23:30;
   Su 12:00-22:00". Раньше строка резалась по 22 символам и превращалась в
   мусор — «Mo-We 11:00-23:30; Su». Разбираем то, что разбирается уверенно,
   и отвечаем на вопрос, который человек на самом деле задаёт: открыто ли
   сегодня. Всё, в чём не уверены, показываем как есть — не притворяемся,
   что поняли. */
const OSM_DAY = { Su:0, Mo:1, Tu:2, We:3, Th:4, Fr:5, Sa:6 };

function hoursToday(spec){
  if (!spec) return null;
  const s = String(spec).trim();
  if (s === "24/7") return T("open around the clock");
  /* сезонные и астрономические правила не трогаем: Apr-Oct, sunset, week 1-52 */
  if (/\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|sunset|sunrise|dawn|dusk|week|easter)\b/i.test(s)) return null;

  const rules = s.split(";")
    .reduce((acc, part) => acc.concat(part.split(/(?<=\d)\s*,\s*(?=[A-Za-z])/)), [])
    .map(x => x.trim()).filter(Boolean);

  const today = new Date().getDay();
  let hit = null;                       /* последнее правило про сегодня побеждает */
  const selRe = /^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:\s*-\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))?|PH)(?:\s*,\s*(?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:\s*-\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))?|PH))*)\s+(.+)$/;

  for (const rule of rules) {
    let days = null, rest = rule;
    const m = rule.match(selRe);
    if (m) { days = m[1]; rest = m[2].trim(); }

    let set;
    if (days === null) {
      set = [0,1,2,3,4,5,6];           /* без селектора — правило на всю неделю */
    } else {
      set = [];
      for (const tok of days.split(",").map(x => x.trim())) {
        if (tok === "PH") continue;    /* праздники не выдумываем */
        const r = tok.split("-").map(x => x.trim());
        if (r.length === 1) { set.push(OSM_DAY[r[0]]); continue; }
        let a = OSM_DAY[r[0]], b = OSM_DAY[r[1]];
        if (a === undefined || b === undefined) return null;
        for (let i = a; ; i = (i + 1) % 7) { set.push(i); if (i === b) break; }
      }
      if (!set.length) continue;       /* правило было только про PH */
    }
    if (!set.includes(today)) continue;

    if (/^(?:off|closed)$/i.test(rest)) { hit = { closed: true }; continue; }

    const open = rest.match(/^(\d{1,2})\s*:\s*(\d{2})\s*\+$/);
    if (open) { hit = { from: open[1].padStart(2,"0") + ":" + open[2] }; continue; }

    const spans = rest.split(",").map(x => x.trim());
    const out = [];
    for (const sp of spans) {
      const t = sp.match(/^(\d{1,2})\s*:\s*(\d{2})\s*-\s*(\d{1,2})\s*:\s*(\d{2})$/);
      if (!t) return null;             /* синтаксис не наш — отдаём строку как есть */
      out.push(t[1].padStart(2,"0") + ":" + t[2] + "–" + t[3].padStart(2,"0") + ":" + t[4]);
    }
    hit = { spans: out };
  }

  if (!hit) return T("closed today");
  if (hit.closed) return T("closed today");
  if (hit.from) return T("today from %s").replace("%s", hit.from);
  return T("today %s").replace("%s", hit.spans.join(", "));
}

/* Городские части идут своим порядком, а не алфавитным: Praha 2 перед
   Praha 10, именные части (Praha-Kunratice) после нумерованных, без района —
   в конец. Иначе десятка встаёт между единицей и двойкой. */
function districtRank(d){
  if (!d) return [3, 0, ""];
  const m = String(d).match(/^Praha\s+(\d{1,2})$/i);
  if (m) return [0, parseInt(m[1], 10), ""];
  if (/^Praha[\s-]/i.test(d)) return [1, 0, d];
  return [2, 0, d];
}
function byDistrict(a, b){
  const x = districtRank(a.d), y = districtRank(b.d);
  return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2]) || a.n.localeCompare(b.n);
}
const venuesFor = bid => DATA.venues.filter(v => v.b.indexOf(bid) >= 0).sort(byDistrict);

function tally(n){
  let h = '<span class="tally" aria-hidden="true">';
  for (let i = 0; i < Math.min(n, 20); i++) h += '<i' + ((i + 1) % 5 === 0 ? ' class="five"' : "") + "></i>";
  return h + "</span>" + (n > 20 ? ' <span style="color:var(--muted);font-size:14px">' + n + "</span>" : "");
}

const NOUNY = new Set(["coffee, caramel", "Saaz, herbal", "citrus, tropical",
  "káva, karamel", "žatecký, bylinný", "citrus, tropy"]);
function deltaWord(ax, d, strong){
  const w = POLE[ax][d > 0 ? 1 : 0];
  if (Math.abs(d) < (strong || 4) || NOUNY.has(w)) return w;
  return (w.startsWith("more ") || w.startsWith("less ") ? (LANG==="cs"?"mnohem ":"much ") : (LANG==="cs"?"mnohem ":"far more ")) + w;
}
function explain(a, c){
  const diffs = AX.map((ax,i)=>({ax,d:c.f[i]-a.f[i]})).filter(x=>Math.abs(x.d)>=1.5)
    .sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,3);
  if(!diffs.length) return (LANG==="cs"?"velmi blízko ":"very close to ")+"<b>"+esc(a.name)+"</b>";
  return (LANG==="cs"?"jako <b>":"like <b>")+esc(a.name)+"</b>"+(LANG==="cs"?", ale ":", but ")+diffs.map(x=>deltaWord(x.ax,x.d)).join(", ");
}
function nearest(b, n){
  return pourable.filter(x=>x.id!==b.id).map(x=>{
    let s=0; for(let i=0;i<AX.length;i++){const d=b.f[i]-x.f[i]; s+=d*d;}
    return {x, d:Math.sqrt(s)};
  }).sort((p,q)=>p.d-q.d).slice(0,n);
}

/* ── знак сорта: бокал в настоящем цвете пива ─────────────────────────
   EBC ни у одного сорта в данных нет, поэтому цвет берётся из типичного
   диапазона стиля. Это уровень «style», и в интерфейсе он помечен так же,
   как оценки вкуса. Стиля нет — бокала нет: пустое стекло не рисуем. */
const EBC_BY_STYLE = {
  "Czech pale lager": 8, "Czech pale lager, unfiltered": 9, "Czech pale special": 11,
  "Czech amber lager": 26, "Czech dark lager": 70, "Euro pale lager": 7, "Pale lager": 7,
  "American IPA": 18, "American pale ale": 14, "Irish dry stout": 125,
  "Witbier": 6, "German wheat beer": 12,
};
const SRM_HEX = ["#FFE699","#FFD878","#FFCA5A","#FFBF42","#FBB123","#F8A733","#F39C00",
"#EA8F00","#E58500","#DE7C00","#D77200","#CF6900","#CB6200","#C35900","#BB5100","#B54C00",
"#B04500","#A63E00","#A13700","#9B3200","#952D00","#8E2900","#882300","#821E00","#7B1A00",
"#771900","#701400","#6A0E00","#660D00","#5E0B00","#5A0A02","#600903","#520907","#4C0505",
"#470606","#440607","#3F0708","#3B0607","#3A070B","#36080A"];

function beerColour(style){
  const e = EBC_BY_STYLE[style];
  if (!e) return null;
  return SRM_HEX[Math.max(1, Math.min(40, Math.round(e / 1.97))) - 1];
}

/* w — ширина в пикселях. etch=true вытравливает градус на стекле; в списке
   он не нужен, там степень и так стоит строкой под названием. */
function glassSvg(b, w, etch){
  const c = beerColour(b.style);
  if (!c) return "";
  const id = "g" + b.id.replace(/[^a-z0-9]/gi, ""), h = Math.round(w * 1.42);
  const hazy = /unfiltered/.test(b.style) || b.style === "Witbier" || b.style === "German wheat beer";
  const dark = (EBC_BY_STYLE[b.style] || 0) > 40;
  const ef = dark ? "#FBF8EF" : "var(--ink)", eo = dark ? ".66" : ".44";
  const et = (etch && b.plato)
    ? `<text x="50" y="96" text-anchor="middle" class="etch-n" fill="${ef}" opacity="${eo}">${b.plato}°</text>` : "";
  const haze = hazy
    ? `<circle cx="42" cy="72" r="15" fill="#fff" opacity=".14"/><circle cx="64" cy="98" r="11" fill="#fff" opacity=".11"/>` : "";
  const body = "M22 16h56l-5 108a8 8 0 0 1-8 7.5H35a8 8 0 0 1-8-7.5z";
  return `<svg class="glass" viewBox="0 0 100 142" width="${w}" height="${h}" role="img"
    aria-label="${esc(b.name)}"><defs><clipPath id="c${id}"><path d="${body}"/></clipPath>
    <linearGradient id="l${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".84"/>
    <stop offset="1" stop-color="${c}" stop-opacity="1"/></linearGradient></defs>
    <g clip-path="url(#c${id})"><rect x="0" y="36" width="100" height="106" fill="url(#l${id})"/>
    <rect x="0" y="14" width="100" height="22" fill="var(--foam)"/>
    <path d="M18 36q7 6 14 0t14 0 14 0 14 0 14 0v7H18z" fill="var(--foam)"/>${haze}
    <rect x="28" y="36" width="7" height="106" fill="#fff" opacity=".17"/></g>
    <path d="${body}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>${et}</svg>`;
}

function lvlTag(l){ return '<span class="lvl ' + (l === "brewery" ? "b" : "s") + '">' + T(l === "brewery" ? "brewery" : "style") + "</span>"; }

function brewhouse(pr, beerId){
  const a = pr.attenuation, tl = pr.timeline;

  /* метка полезна, только пока она про меньшинство: если все строки одного
     уровня, значок на каждой ничего не сообщает. Считаем по всей секции,
     большинство объявляем строкой под заголовком, помечаем только остаток. */
  const lv = [tl.lvl].concat(pr.ingredients.map(x => x.lvl),
    pr.stages.reduce((acc, st) => acc.concat(st.params.map(x => x.lvl)), []));
  const nB = lv.filter(l => l === "brewery").length, nS = lv.length - nB;
  const major = nB >= nS ? "brewery" : "style";
  const tag = l => l === major ? "" : lvlTag(l);
  const decl = (nB && nS)
    ? (major === "brewery"
        ? T("Unless marked %s, everything below is known for this brewery.")
            .replace("%s", lvlTag("style"))
        : T("Unless marked %s, everything below is what beers of this style normally do, and is not confirmed for this beer.")
            .replace("%s", lvlTag("brewery")))
    : (nB ? T("Everything below is known for this brewery.")
          : T("Nothing below is confirmed for this beer — it is what beers of this style normally do."));
  const tot = tl.brew + tl.ferment + tl.lager;
  const pc = n => (n / tot * 100).toFixed(1) + "%";

  const stats = a ? `<div class="att">
    <div><b>${a.oe}°</b><span>${T("Wort gravity")}</span><em>${T("before fermentation")}</em></div>
    <div><b>${a.ae}°</b><span>${T("Left in the glass")}</span><em>${T("residual extract")}</em></div>
    <div><b>${a.adf} %</b><span>${T("Fermented out")}</span><em>${T("apparent attenuation")}</em></div>
  </div>` : "";

  const timeline = `<div class="tl-wrap">
    <div class="tl-head"><span class="t">${T("Grain to glass")} ${tag(tl.lvl)}</span>
      <span class="tot">≈ ${tl.total} ${daysWord(tl.total)}</span></div>
    <div class="tl-bar">
      <span class="b0" style="width:${pc(tl.brew)}"></span>
      <span class="b1" style="width:${pc(tl.ferment)}"></span>
      <span class="b2" style="width:${pc(tl.lager)}"></span>
    </div>
    <div class="tl-key">
      <span><i style="background:var(--gold)"></i>${T("Brew day — one shift")}</span>
      <span><i style="background:var(--green-light)"></i>${LANG==="cs"?"Kvašení":"Fermentation"} — ${tl.fermentLabel}</span>
      <span><i style="background:var(--green)"></i>${LANG==="cs"?"Ležení":"Lagering"} — ${tl.lagerLabel}</span>
    </div>
  </div>`;

  const ing = pr.ingredients.length ? `<div class="ing">${pr.ingredients.map(x=>`
    <div class="ing-c">${ICON[x.icon] || ""}<div class="txt">
      <div class="k">${esc(x.k)}${tag(x.lvl)}</div><div class="val">${x.v}</div></div></div>`).join("")}

  const stages = `<div class="stages">${pr.stages.map(s=>`

const AXNAME = new Proxy({}, {get:(_,k)=>LANG==="cs"?(AXNAME_CS[AXNAME_EN[k]]||AXNAME_EN[k]):AXNAME_EN[k]});
const POLE = new Proxy({}, {get:(_,k)=>LANG==="cs"?(POLE_CS[k]||POLE_EN[k]):POLE_EN[k]});
const SLIDER_AX = ["bitterness","maltSweetness","body","roast","hopProfile"];
const ANCHOR_IDS = ["pilsner-urquell","kozel-cerny","budweiser-budvar-original",
  "guinness-draught","corona-extra","brewdog-punk-ipa","hoegaarden","matuska-raptor"];
let anchorId = "pilsner-urquell", deltas = {};

function finderPage(){
  $("#view").innerHTML = `
    <p class="crumb">${T("Find your beer")}</p>
    <h1 style="font-size:44px;margin-bottom:8px">${T("Start from a beer you know")}</h1>
    <p class="lead" style="max-width:64ch">${T("Nobody can answer &ldquo;dryness, 1 to 10&rdquo;. Everybody can name\n      a beer they have had. Pick one, push it around, and the atlas walks the graph to what is\n      poured in Prague.")}</p>
    <div class="finder">
      <div class="fcol">
        <p class="step">${T("1 · A beer you know")}</p>
        <div class="chips" id="anchors"></div>
        <p class="step next">${T("2 · But make it")}</p>
        <div id="sliders"></div>
        <button class="reset" id="reset">${T("Reset all")}</button>
      </div>
      <div class="fcol">
        <p class="step" id="resHead">${T("Closest, and where to drink it")}</p>
        <div id="results"></div>
      </div>
    </div>
    <p class="note"><b>${T("Weighting is deliberate.")}</b> ${T("Axes you actually moved count for more than the\n      ones you left alone — asking for less bitterness makes a bitterness miss cost more. The match\n      is plain arithmetic, not a model: same input, same answer, every time, and it cannot invent\n      a taste claim.")}</p>`;

  $("#anchors").innerHTML = ANCHOR_IDS.filter(i=>beerById[i]).map(i=>
    `<button class="chip" data-anchor="${i}" aria-pressed="${i===anchorId}">${esc(beerById[i].name)}</button>`).join("");
  $("#sliders").innerHTML = SLIDER_AX.map(ax=>{ const label = AXNAME[ax]; return `
    <div class="sl">
      <div class="lab"><b>${label}</b><i id="v-${ax}">${deltas[ax] ? esc(deltaWord(ax,deltas[ax],3)) : (LANG==="cs"?"beze změny":"unchanged")}</i></div>
      <input type="range" min="-4" max="4" step="1" value="${deltas[ax]||0}" data-ax="${ax}" aria-label="${label}">
      <div class="poles"><span>${POLE[ax][0]}</span><span>${POLE[ax][1]}</span></div>
    </div>`; }).join("");
  runMatch();
}

function runMatch(){
  const a = beerById[anchorId];
  const target = a.f.map((v,i)=>Math.max(0,Math.min(10, v + (deltas[AX[i]]||0))));
  const scored = pourable.filter(b=>b.id!==anchorId).map(b=>{
    let s=0;
    for(let i=0;i<AX.length;i++){
      const w = 1 + Math.abs(deltas[AX[i]]||0)*0.6;
      const d = target[i]-b.f[i];
      s += w*d*d;
    }
    return {b, dist:Math.sqrt(s)};
  }).sort((x,y)=>x.dist-y.dist).slice(0,6);

  const moved = AX.filter(ax=>deltas[ax]).map(ax=>deltaWord(ax,deltas[ax],3));

/* ── распознавание бутылки ──────────────────────────────────────────────
   Первая ступень настоящая: штрихкод читает сам браузер через
   BarcodeDetector, локально. Ни зрительной модели, ни сервера, ни платы.
   Вторая ступень — чтение этикетки — в прототипе не построена, для неё
   нужен бэкенд, и страница об этом прямо говорит.                      */

const RUNGS = [
  ["barcode", "Barcode", "Read by the phone itself. Exact when it hits."],
  ["label",   "Label",   "The name on the front. You can type it; having the camera read it needs a server."],
  ["brewery", "Brewery", "Beer unknown, brewery known. Enough to say where it is poured."],
  ["anchor",  "Anchor",  "Nothing known. We take what the label says into the finder."]
];

function rungList(hit){
  const order = ["barcode", "label", "brewery", "anchor"];
  const at = order.indexOf(hit);
  return `<div class="rungs">${RUNGS.map(([id, name, why], i) => {
    const cls = id === hit ? "rung hit" : (i < at ? "rung" : "rung skip");
    return `<div class="${cls}"><i>${i + 1}</i><div>
      <b>${T(name)}</b><span>${T(why)}</span></div></div>`;
  }).join("")}</div>`;
}

/* Три входа — штрихкод, чтение этикетки и набор руками — сходятся сюда.
   Разница принципиальная и её видно на экране: штрихкод даёт ОТВЕТ, а
   название с этикетки даёт КАНДИДАТОВ, потому что это всегда догадка. */
function renderAnswer(r, hit){
  const el = $("#scan-out");
  const br = r.brewery ? brById[r.brewery] : null;
  let body = "";
  if (r.kind === "beer") {
    const b = beerById[r.id] || {};
    body = `<h3>${esc(b.name || r.label)}</h3>
      <p>${T("Matched. There is a full page: how it is made, how it differs from a beer you know, and where to drink it.")}</p>
      <button class="btn-go" data-go="#/beer/${r.id}">${T("Open the beer")}</button>`;
  } else if (r.kind === "listed") {
    const l = listedById[r.id] || {};
    body = `<h3>${esc(l.name || r.label)}</h3>
      <p>${T("Matched a catalogue line. We know the numbers, the brewery and where to drink it. We have not tasted it, so there is no description.")}</p>
      <button class="btn-go" data-go="#/listed/${r.id}">${T("Open the line")}</button>`;
  } else if (r.kind === "brewery") {
    body = `<h3>${esc(br ? br.name : r.brand)}</h3>
      <p>${T("This exact beer is not in the atlas. The brewery is, and that answers the question you actually asked: where it is poured in Prague.")}</p>
      <button class="btn-go" data-go="#/brewery/${r.id}">${T("Where the brewery is poured")}</button>`;
  } else if (r.kind === "hint") {
    body = `<h3>${esc(r.label)}</h3>
      <p>${T("We have not confirmed this as a brewery — it is a name on a tap, and nothing more. But we know who puts it there, and that is still an answer:")}
        <b>${esc((r.venues || []).join(", "))}</b>.</p>
      <button class="btn-alt" data-go="#/breweries">${T("Marks we have not confirmed")}</button>`;
  } else {
    const read = [r.label, r.brand, r.abv ? r.abv + " %" : null, r.plato ? r.plato + "°" : null]
      .filter(Boolean).join(" · ");
    body = `<h3>${T("Not in the atlas")}</h3>
      <p>${T("Here is everything the barcode gave us:")} <b>${esc(read)}</b>.
        ${T("No Prague venue in our data pours it. Rather than invent a page, we hand you to the finder with what we read.")}</p>
      <button class="btn-alt" data-go="#/find">${T("Find your beer")}</button>`;
  }
  el.innerHTML = rungList(hit) + `<div class="answer"><div class="answer-in">${body}</div></div>`;
  el.scrollIntoView({block: "nearest"});
}

function scanAnswer(ean){
  const r = (DATA.scan || {})[ean];

/* Набор с этикетки. Работает для ЛЮБОЙ бутылки, включая те, у которых нет
   ни штрихкода в нашей таблице, ни фотографии: человек и так читает
   название глазами, здесь он просто набирает три буквы. Ноль вызовов
   наружу — ищем по тому, что уже лежит в странице. */
const fold = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

let LABEL_IDX = null;
function labelIndex(){
  if (LABEL_IDX) return LABEL_IDX;
  const idx = [];
  const add = (kind, id, name, extra, brewery, venues) => {
    if (name) idx.push({kind, id, label: name, brand: extra || "", brewery, venues,
                        k: fold(name + " " + (extra || ""))});
  };
  (DATA.beers || []).filter(b => !b.anchor)
    .forEach(b => add("beer", b.id, b.name, [b.cs, b.style].filter(Boolean).join(" "), b.breweryId));
  (DATA.listed || []).forEach(b => add("listed", b.id, b.name, b.cs, b.breweryId));
  (DATA.breweries || []).forEach(b => add("brewery", b.id, b.name, b.nameEn || "", b.id));
  (DATA.hints || []).forEach(h => add("hint", null, h.brand, "", null, h.venues));
  LABEL_IDX = idx;
  return idx;
}

const KIND_ORDER = {beer: 0, listed: 1, brewery: 2, hint: 3};

function labelSearch(q){
  const toks = fold(q).split(/\s+/).filter(t => t.length >= 2);
  if (!toks.length) return [];
  const hits = [];
  for (const it of labelIndex()) {
    if (!toks.every(t => it.k.indexOf(t) >= 0)) continue;
    const head = fold(it.label).startsWith(toks[0]) ? 0 : 1;
    hits.push([head, KIND_ORDER[it.kind], it.label.length, it]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  return hits.slice(0, 8).map(h => h[3]);
}

const KIND_WHY = {beer: "full page", listed: "catalogue line",
                  brewery: "brewery", hint: "unconfirmed mark"};

function labelResults(q){
  const box = $("#label-out");
  const hits = labelSearch(q);
  if (!q.trim()) { box.innerHTML = ""; return; }
  if (!hits.length) {
    box.innerHTML = `<p class="note" style="border:0;padding:0;margin-top:10px">${
      T("Nothing in the atlas reads like that. Try the brewery name instead — it is usually the biggest word on the label.")}</p>`;
    return;
  }
  box.innerHTML = `<div class="bottles" style="margin-top:12px">${hits.map((h, i) => `
    <button class="bottle" data-hit="${i}">
      <span class="n">${esc(h.label)}</span>
      <span class="m">${T(KIND_WHY[h.kind])}${h.brewery && brById[h.brewery] && h.kind !== "brewery"
        ? " · " + esc(brById[h.brewery].name) : ""}</span>
    </button>`).join("")}</div>`;
  box.querySelectorAll("[data-hit]").forEach(b => {
    b.onclick = () => {
      const h = hits[+b.dataset.hit];
      renderAnswer(h, h.kind === "hint" ? "anchor"
        : (h.kind === "brewery" ? "brewery" : "label"));
    };
  });
}

let camStream = null;
async function scanCamera(){
  const out = $("#scan-note"), vid = $("#cam");
  if (!("BarcodeDetector" in window)) {
    out.textContent = T("This browser cannot read barcodes. Type the digits instead.");
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
  } catch (e) {
    out.textContent = T("No camera here. Type the digits under the barcode instead.");
    return;
  }
  vid.hidden = false; vid.srcObject = camStream; await vid.play();
  out.textContent = T("Point the camera at the barcode.");
  const det = new BarcodeDetector({formats: ["ean_13", "ean_8", "upc_a"]});
  const tick = async () => {
    if (!camStream) return;
    try {
      const found = await det.detect(vid);
      if (found.length) {
        const code = found[0].rawValue;
        stopCamera(); out.textContent = T("Barcode read:") + " " + code;
        scanAnswer(code); return;
      }
    } catch (e) {}
    requestAnimationFrame(tick);
  };
  tick();
}
function stopCamera(){
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null;
  const v = $("#cam"); if (v) { v.hidden = true; v.srcObject = null; }
}

/* ── router ──────────────────────────────────────────────────────────── */
function route(){
  let h = location.hash && location.hash !== "#/" ? location.hash : "#/home";
  const lm = h.match(/^#\/(en|cs)\b(.*)$/);
  if (lm) { LANG = lm[1]; h = "#" + (lm[2] || "/home"); }
  document.querySelectorAll("[data-lang]").forEach(x =>
    x.toggleAttribute("aria-current", x.dataset.lang === LANG));
  document.querySelectorAll("[data-i18n]").forEach(x => x.textContent = T(x.dataset.i18n));
  document.documentElement.lang = LANG;
  const [, kind, id] = h.split("/");
  document.querySelectorAll(".nav button").forEach(b =>
    b.toggleAttribute("aria-current", b.dataset.go === "#/" + kind + "s" || b.dataset.go === h));
  stopCamera();
  if (kind === "home" || !kind) homePage();
  else if (kind === "find") finderPage();
  else if (kind === "beers") beersPage();
  else if (kind === "listed") listedPage(id);
  else if (kind === "scan") scanPage();
  else if (kind === "breweries") breweriesPage();
  else if (kind === "brewery") breweryPage(id);
  else if (kind === "venues") venuesPage();
  else if (kind === "ordering") orderingPage();
  else if (kind === "brewing") brewingPage();
  else if (kind === "correct") correctPage();
  else beerPage(id);
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { location.hash = "/" + LANG + go.dataset.go.slice(1); return; }
  const lg = e.target.closest("[data-lang]");
  if (lg) { setLang(lg.dataset.lang); return; }
  const a = e.target.closest("[data-anchor]");
  if (a) {
    anchorId = a.dataset.anchor;
    document.querySelectorAll("[data-anchor]").forEach(x => x.setAttribute("aria-pressed", x === a));
    runMatch();
  }
  if (e.target.id === "reset") {
    deltas = {};
    document.querySelectorAll("#sliders input").forEach(i => {
      i.value = 0; $("#v-" + i.dataset.ax).textContent = (LANG==="cs"?"beze změny":"unchanged");
    });
    runMatch();
  }
});
document.addEventListener("input", e => {
  const ax = e.target.dataset && e.target.dataset.ax;
  if (!ax) return;
  deltas[ax] = +e.target.value;
  $("#v-" + ax).textContent = deltas[ax] ? deltaWord(ax, deltas[ax], 3) : (LANG==="cs"?"beze změny":"unchanged");
  runMatch();
});

/* ── čárky: локально в браузере, без выдуманных общих счётчиков ────── */
const VOTES = (() => {
  try { return JSON.parse(localStorage.getItem("pba.votes") || "{}"); } catch (e) { return {}; }
})();
function saveVotes(){ try { localStorage.setItem("pba.votes", JSON.stringify(VOTES)); } catch (e) {} }

function paintCoaster(fresh){
  const c = document.querySelector(".coaster"); if(!c) return;
  const id = c.dataset.beer, v = VOTES[id] || {};
  const n = v.up || 0;
  c.querySelector("[data-cnt]").textContent = n;
  let h = "";
  for (let i = 0; i < Math.min(n, 25); i++) {
    const cls = [(i + 1) % 5 === 0 ? "five" : "", fresh && i === n - 1 ? "fresh" : ""].filter(Boolean).join(" ");
    h += "<i" + (cls ? ' class="' + cls + '"' : "") + "></i>";
  }
  c.querySelector("[data-marks]").innerHTML = h ||
    '<span class="none">' + T("your strokes go here") + '</span>';
  const pr = c.querySelector("[data-prompt]");
  /* Раньше чешские варианты были зашиты здесь же, а в английской ветке
     стояло 'Liked it? <em>${T("Mark it down.")}</em>' в ОДИНАРНЫХ кавычках —
     подстановка не срабатывала, и на английской странице печаталось
     ${T("Mark it down.")} буквально. Всё переведено на T(): чешский живёт
     только в ui_cs.py, и проверка паритета видит эти строки. */
  if (pr) pr.innerHTML = n === 0
        ? T("Liked it?") + ' <em>' + T("Mark it down.") + '</em>'
        : n === 1
        ? T("One down.") + ' <em>' + T("Had another?") + '</em>'
        : T("That is %s.").replace("%s", n) + ' <em>' + T("Keep counting.") + '</em>';
  const fill = c.querySelector("[data-beer-fill]");
  if (fill) fill.style.transform = "scaleY(" + Math.min(0.1 + n * 0.075, 1) + ")";
  c.querySelector('[data-vote="down"]').setAttribute("aria-pressed", !!v.down);
}

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-vote]"); if(!btn) return;
  const c = btn.closest(".coaster"), id = c.dataset.beer;
  const v = VOTES[id] = VOTES[id] || {};
  if (btn.dataset.vote === "up") { v.up = (v.up || 0) + 1; v.down = 0; }
  else { v.down = v.down ? 0 : 1; if (v.down) v.up = 0; }
  saveVotes(); paintCoaster(btn.dataset.vote === "up");
});

const _route = route;
route = function(){ _route(); paintCoaster(); };
addEventListener("hashchange", paintCoaster);

route();
