<title>Prague Beer Atlas</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Beer Atlas">
<meta property="og:title" content="Beer Atlas — Czech beer explained">
<meta property="og:description" content="“Like Pilsner Urquell, only less bitter and drier.” Every Czech beer described through one you have already had — and where to drink it in Prague.">
<meta property="og:url" content="https://www.beeratlas.eu/">
<meta property="og:image" content="https://www.beeratlas.eu/brand/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="“Like Pilsner Urquell, only less bitter and drier.” Every Czech beer described through one you have already had — and where to drink it in Prague.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<!-- Прототип в поиск не отдаём: 70 значений стоят на unverified, а бриф
     запрещает публиковать такие. Убрать эту строку, когда данные
     вычитаны — тогда же снимется и ограничение. -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  --card:#EAE1CC; --card-light:#F4EEDD; --foam:#FBF8EF;
  --ink:#17190F; --body:#35382A; --muted:#6F6B57;
  --line:#CFC5A9; --line-soft:#DCD2B6;
  --green:#1C3A29; --green-light:#7E9A88; --green-pale:#C4D2C8;
  --gold:#B8862B; --gold-bright:#D9A03C;
  --accent:#8A5E15; --dotted:#A89A72; --stale:#8E2318;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --card:#12160F; --card-light:#1B2117; --foam:#E8E2CE;
  --ink:#EFE7D0; --body:#D0C9B1; --muted:#8E8A72;
  --line:#2F3728; --line-soft:#333B2B;
  --green:#24422F; --green-light:#5F7E6B; --green-pale:#B6C7BB;
  --accent:#D9A03C; --dotted:#7A6C48; --stale:#D4796A;
}}
:root[data-theme="dark"]{
  --card:#12160F; --card-light:#1B2117; --foam:#E8E2CE;
  --ink:#EFE7D0; --body:#D0C9B1; --muted:#8E8A72;
  --line:#2F3728; --line-soft:#333B2B;
  --green:#24422F; --green-light:#5F7E6B; --green-pale:#B6C7BB;
  --accent:#D9A03C; --dotted:#7A6C48; --stale:#D4796A;
}

*{box-sizing:border-box}
body{margin:0;background:var(--card);color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}

/* ── enamel sign ── */
.sign{background:var(--green);border-bottom:5px solid var(--gold)}
.sign-in{max-width:1180px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.wordmark{font-weight:700;font-size:15px;letter-spacing:.19em;text-transform:uppercase;color:var(--foam);
  display:flex;align-items:center;gap:11px}
/* знак без имени: имя стоит рядом словом, дублировать его в круге незачем */
.brandmark{width:27px;height:27px;flex:none;display:block}
.nav{display:flex;gap:18px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.nav button{font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:var(--green-pale);font-weight:500}
.nav button:hover,.nav button[aria-current="page"]{color:var(--foam)}
.langsw{margin-left:auto;display:flex;border:1.5px solid var(--gold)}
.langsw button{font-size:12px;font-weight:700;letter-spacing:.1em;padding:6px 11px;color:var(--green-pale)}
.langsw button[aria-current]{background:var(--gold);color:#17190F}

.wrap{max-width:1180px;margin:0 auto;padding:0 26px 80px}

/* лист для домашней варки — врезка в боковой колонке */
.brewline{margin:26px 0 0;padding:15px 20px;background:var(--card-light);
  border-left:4px solid var(--gold);font-size:16.5px;max-width:64ch}
.brewline a{font-weight:600}

.brewsheet{display:block;background:var(--green);color:var(--foam);padding:18px 20px 20px;
  margin-bottom:22px;border-bottom:4px solid var(--gold);text-decoration:none}
.brewsheet:hover{background:#16301f}
.bs-eyebrow{display:block;font-size:10.5px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold-bright);margin-bottom:8px}
.brewsheet b{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:22px;
  line-height:1.12;display:block;margin-bottom:7px;color:var(--foam)}
.bs-sub{display:block;font-size:13.5px;line-height:1.45;color:var(--green-pale)}

/* ── beer page ── */
.crumb{font-size:12.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:38px 0 16px}
.crumb a{color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 176px;gap:40px;align-items:start}
h1{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:clamp(40px,6vw,66px);
  line-height:.98;letter-spacing:-.012em;margin:0 0 12px}
.rule{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.rule i{height:3px;width:46px;background:var(--gold);display:block}
.rule em{font-style:normal;font-size:14.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--green)}
.lead{font-size:19px;line-height:1.6;color:var(--body);max-width:56ch;margin:0}

.stamp{width:176px;height:176px;border-radius:50%;background:var(--green);
  box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 6px var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--foam)}
.stamp .fig{font-family:"Abril Fatface",Georgia,serif;font-size:52px;line-height:1}
.stamp .cap{font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-bright);margin-top:6px}
.stamp .hr{width:34px;height:1.5px;background:#4C6A57;margin:9px 0}
.stamp .alc{font-size:16px;font-weight:600}

/* label frame */
.frame{margin:40px 0 0;border:3px solid var(--green);padding:5px;background:var(--green)}
.frame-in{border:1px solid var(--green-light);background:var(--card-light);padding:26px 30px 28px}
.frame h2{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:27px;margin:0 0 3px}
.frame .sub{font-size:15.5px;color:var(--muted);margin:0 0 26px}

.axes{display:flex;flex-direction:column;gap:15px;max-width:830px}
.ax{display:grid;grid-template-columns:150px minmax(0,1fr) 170px;gap:20px;align-items:center}
.ax .name{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);text-align:right}
.ax .track{position:relative;height:22px}
.ax .track .base{position:absolute;top:10px;left:0;right:0;height:2px;background:var(--line-soft)}
.ax .track .a{position:absolute;top:5px;width:3px;height:12px;background:#8F8B72}
.ax .track .c{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;background:var(--gold);
  border:2px solid var(--ink);border-radius:50%}
.ax .word{font-size:16.5px;font-weight:600;color:var(--green)}
.legend{display:flex;gap:26px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line-soft);
  font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:8px}
.legend .k1{width:3px;height:12px;background:#8F8B72}
.legend .k2{width:12px;height:12px;background:var(--gold);border:2px solid var(--ink);border-radius:50%}

/* body columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 322px;gap:52px;padding:42px 0 0}
.cols h2{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:30px;margin:0 0 12px}
.cols h2+p{margin-top:0}
.cols section+section{margin-top:32px}
.cols p{font-size:18px;line-height:1.66;color:var(--body);margin:0 0 16px}

.where-h{display:flex;align-items:center;gap:16px;margin:34px 0 4px}
.where-h h2{margin:0}
.tally{display:inline-flex;gap:3px;align-items:flex-end;margin-bottom:4px}
.tally i{display:block;width:2.5px;height:17px;background:var(--accent);transform:skewX(-9deg)}
.tally i.five{width:19px;height:2.5px;transform:rotate(-26deg) translateY(-8px) translateX(-18px);margin-right:-18px}
.vlist{border-top:3px solid var(--green);margin-top:12px}
.v{display:grid;grid-template-columns:minmax(0,1fr) 190px 120px;gap:16px;padding:13px 0;
  border-bottom:1px solid var(--line);align-items:baseline}
.v .n{font-size:18.5px;font-weight:600}
.v .d{font-size:15px;color:var(--muted)}
.v .p{font-size:15px;font-weight:600}
h2.dist{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  font-family:"Archivo",system-ui,sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  margin:30px 0 0;padding-bottom:7px;border-bottom:2px solid var(--gold)}
h2.dist span{font-weight:500;letter-spacing:.06em;text-transform:none;font-size:13px}
.v .hint{display:block;font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:3px}
.v .hint b{color:var(--body)}
.v .h{font-size:13px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.miss{color:var(--muted);font-weight:400;border-bottom:1px dotted var(--dotted)}

/* čárka — лайк как отметка на подставке */
.coaster{border:2px solid var(--ink);background:var(--card-light);padding:18px 20px 20px;
  display:flex;flex-direction:column;gap:14px}
.coaster .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.coaster .ttl{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.coaster .cnt{font-family:"Abril Fatface",Georgia,serif;font-size:28px;line-height:1}

/* поле для палочек — как настоящий тácek */
.marks{min-height:46px;display:flex;align-items:flex-end;gap:5px;flex-wrap:wrap;
  border:1px dashed var(--line);padding:10px 12px;background:var(--card)}
.marks i{display:block;width:3px;height:26px;background:var(--accent);transform:skewX(-9deg)}
.marks i.five{width:28px;height:3px;transform:rotate(-26deg) translateY(-12px) translateX(-27px);margin-right:-27px}
.marks i.fresh{animation:draw .34s ease-out}
@keyframes draw{from{height:0;opacity:0}to{opacity:1}}
.marks .none{font-size:13.5px;color:var(--muted);font-style:italic;line-height:1.4}

/* приглашение — оно и объясняет, зачем нажимать */
.prompt{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:19px;
  line-height:1.25;margin:0;color:var(--ink)}
.prompt em{font-style:normal;color:var(--accent)}

/* клавиша: золото, борт снизу, настоящий ход при нажатии */
.carka{display:flex;align-items:center;gap:14px;width:100%;
  background:var(--gold);color:#17190F;border:2px solid var(--ink);
  box-shadow:0 5px 0 var(--ink);padding:13px 16px;transition:transform .06s,box-shadow .06s}
.carka:hover{background:var(--gold-bright)}
.carka:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.carka .lab{display:flex;flex-direction:column;gap:1px;text-align:left}
.carka .lab b{font-size:16.5px;font-weight:700;letter-spacing:.01em}
.carka .lab span{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.carka .glass{flex-shrink:0}
.carka .beer{transition:transform .3s ease-out;transform-origin:bottom}

/* отрицание — тихой ссылкой, а не второй кнопкой */
.notme{align-self:flex-start;font-size:13.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:1px}
.notme:hover{color:var(--ink)}
.notme[aria-pressed="true"]{color:var(--stale);border-bottom-color:var(--stale)}
.coaster .hint{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.marks i.fresh{animation:none}.carka .beer{transition:none}}

/* how it is made — варочный цех */
.att{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--ink);
  border:2px solid var(--ink);margin:20px 0 30px}
.att div{background:var(--card-light);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.att b{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:30px;line-height:1}
.att span{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.att em{font-style:normal;font-size:13px;color:var(--muted)}

/* шкала времени: неделя брожения против полутора месяцев лежания */
.tl-wrap{border:2px solid var(--ink);background:var(--card-light);padding:18px 20px 20px;margin:0 0 34px}
.tl-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.tl-head .t{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tl-head .tot{font-family:"Abril Fatface",Georgia,serif;font-size:22px}
.tl-bar{display:flex;height:26px;border:1.5px solid var(--ink);overflow:hidden}
.tl-bar span{display:block;height:100%}
.tl-bar .b0{background:var(--gold)}
.tl-bar .b1{background:var(--green-light)}
.tl-bar .b2{background:var(--green)}
.tl-key{display:flex;gap:22px;margin-top:11px;flex-wrap:wrap;font-size:13px;color:var(--body)}
.tl-key span{display:flex;align-items:center;gap:7px}
.tl-key i{width:13px;height:13px;display:block;border:1px solid var(--ink)}

/* что кладут */
.ing{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2px;
  background:var(--line);border:2px solid var(--ink);margin:14px 0 34px}
.ing-c{background:var(--card-light);padding:18px 20px;display:flex;gap:16px;align-items:flex-start}
.ing-c svg{flex-shrink:0;margin-top:1px}
.ing-c .txt{min-width:0}
.ing-c .k{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.ing-c .val{font-size:15.5px;line-height:1.55;color:var(--body)}
.ing-c .val em{font-style:italic;color:var(--ink)}

/* этапы */
.stages{position:relative;margin:14px 0 26px}
.stages::before{content:"";position:absolute;left:33px;top:30px;bottom:30px;width:2px;
  background:var(--line);z-index:0}
.stg{position:relative;display:grid;grid-template-columns:68px minmax(0,1fr);gap:24px;
  padding:0 0 26px;z-index:1}
.stg .ves{width:68px;height:68px;background:var(--card-light);border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center}
.stg h3{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:22px;margin:0 0 2px;line-height:1.15}
.stg .what{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin:0 0 9px}
.stg .body{font-size:16px;line-height:1.6;color:var(--muted);margin:0 0 12px;max-width:62ch}
.stg .note{font-size:16.5px;line-height:1.6;color:var(--body);margin:0 0 12px;max-width:62ch}
.stg .prm{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.prm-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:start}
.prm-k{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.prm-v{font-size:15.5px;line-height:1.55;color:var(--body)}
.prm-v em{font-style:italic;color:var(--ink)}
.stg .dur{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--green);border:1.5px solid var(--green);padding:2px 8px;margin-left:10px;
  vertical-align:3px}
.lvl{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid currentColor;padding:1px 5px;vertical-align:1px;margin-left:6px}
.lvl.b{color:var(--green)}
.lvl.s{color:var(--muted)}
.conf{font-size:14.5px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.decl{font-size:15px;line-height:1.6;color:var(--muted);margin:0 0 2px;max-width:74ch}


/* ── распознавание бутылки ── */
.scan-in{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 8px}
.scan-in input{font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--ink);
  background:var(--card-light);color:var(--ink);width:220px;letter-spacing:.06em}
.btn-go{border:2px solid var(--ink);background:var(--gold);color:#17190F;padding:13px 20px;
  font-size:14px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
.btn-alt{border:2px solid var(--ink);padding:13px 20px;font-size:14px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;background:var(--card-light)}
#cam{display:block;width:100%;max-width:420px;border:2px solid var(--ink);background:#000;margin-top:14px}
#cam[hidden]{display:none}   /* иначе display:block перебивает атрибут hidden */
.rungs{border:2px solid var(--ink);background:var(--card-light);margin:26px 0 0}
.rung{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--line);align-items:start}
.rung:last-child{border-bottom:0}
.rung i{font-style:normal;width:26px;height:26px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.rung.hit i{border-color:var(--green);background:var(--green);color:var(--foam)}
.rung.hit b{color:var(--ink)}
.rung.skip{opacity:.45}
.rung b{display:block;font-size:15.5px;color:var(--muted)}
.rung span{display:block;font-size:14px;line-height:1.5;color:var(--muted);margin-top:2px}
.answer{border:3px solid var(--green);padding:5px;background:var(--green);margin-top:24px}
.answer-in{border:1px solid var(--green-light);background:var(--card-light);padding:22px 24px}
.answer h3{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:26px;margin:0 0 6px}
.answer p{font-size:16px;line-height:1.6;color:var(--body);margin:0 0 14px;max-width:60ch}
.bottles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px;
  background:var(--line);border:2px solid var(--ink);margin-top:16px}
.bottle{background:var(--card-light);padding:14px 16px;display:block;text-align:left}
.bottle .n{display:block;font-size:16px;font-weight:600;color:var(--ink)}
.bottle .m{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
@media (max-width:620px){.scan-in input{width:100%}}

/* sidebar */
.panel{border:2px solid var(--ink);background:var(--card-light)}
.panel .head{background:var(--ink);color:var(--card);padding:9px 16px;
  font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.panel .in{padding:16px 18px 18px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.kv:last-of-type{border-bottom:0}
.kv span:first-child{font-size:15.5px;color:var(--body)}
.kv b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.panel .foot{margin-top:13px;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:13px;line-height:1.5;color:var(--muted)}
.side-h{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--gold)}
.sidebar{display:flex;flex-direction:column;gap:26px}
.like{display:flex;flex-direction:column;gap:14px}
.like button{display:block;width:100%}
.like .n{font-size:16.5px;font-weight:600}
.like .w{font-size:14.5px;color:var(--body);display:block}
.like .w2{font-size:13px;color:var(--muted);display:block;margin-top:1px}
.like button{padding:2px 0}
.promo{background:var(--green);color:var(--foam);padding:20px 20px 18px;border-bottom:5px solid var(--gold)}
.promo p{font-size:17px;line-height:1.5;margin:0 0 14px;color:var(--foam)}
.promo b{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-bright)}

/* finder */
.finder{display:grid;grid-template-columns:360px minmax(0,1fr);gap:2px;background:var(--line);border:2px solid var(--ink);margin-top:24px}
.fcol{background:var(--card-light);padding:24px 26px}
.step{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin:0 0 13px;padding-bottom:8px;border-bottom:2px solid var(--gold)}
.step.next{margin-top:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border:2px solid var(--line);font-size:14.5px;font-weight:600;color:var(--body)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--ink);color:#17190F}
.sl{margin:16px 0 0}
.sl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.sl .lab b{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sl .lab i{font-style:normal;font-size:13.5px;font-weight:600;color:var(--green);text-align:right}
.sl input[type=range]{width:100%;accent-color:var(--gold);height:22px;margin:0}
.sl .poles{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.reset{margin-top:24px;font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--line)}
.res{padding:17px 0;border-bottom:1px solid var(--line-soft);display:block;width:100%}
.res-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.res h3{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:24px;margin:0;line-height:1.1}
.res .cs{font-size:14px;color:var(--muted)}
.res .exp{font-size:16px;color:var(--body);margin:7px 0 0}
.res .exp b{color:var(--green)}
.res .meta{font-size:13.5px;color:var(--muted);margin-top:6px}

/* index lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:2px;background:var(--line);border:2px solid var(--ink);margin-top:24px}
.cell{background:var(--card-light);padding:16px 18px;display:block}
.cell .n{font-size:17.5px;font-weight:600}
.cell .m{font-size:13.5px;color:var(--muted)}
.cell-in{display:flex;gap:14px;align-items:center}
.cell-t{min-width:0}
.glass{display:block;flex:none}
.etch-n{font-family:"Abril Fatface",Georgia,serif;font-size:23px}
.pours{display:flex;gap:22px;flex-wrap:wrap;margin-top:24px}
.pour{border:2px solid var(--ink);background:var(--card-light);padding:20px;display:flex;gap:18px;
  align-items:flex-start;flex:1 1 300px}
.pour h3{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:24px;margin:0 0 6px}
.pour p{font-size:15.5px;line-height:1.5;color:var(--body);margin:0}

.note{font-size:14.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:15px;margin-top:34px;line-height:1.6;max-width:74ch}
.note b{color:var(--body)}
footer{margin-top:40px;padding-top:22px;border-top:4px solid var(--gold);font-size:12.5px;color:var(--muted);line-height:1.8}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:24px}
  .cols{grid-template-columns:1fr;gap:34px}
  .finder{grid-template-columns:1fr}
  .v{grid-template-columns:1fr;gap:2px}
}
/* узкий экран: ось и вывод остаются одной строкой, шкала уходит под них */
@media (max-width:620px){
  /* этапы варки: посуда 68px плюс отступ 24 оставляли тексту 231px, а внутри
     .prm-row жёсткая колонка 150px — значению доставалось 63px, и чешские
     слова вылезали за экран. Посуду ужимаем, параметры складываем в столбик */
  .stg{grid-template-columns:52px minmax(0,1fr);gap:14px}
  .stg .ves{width:52px;height:52px}
  .stg .ves svg{width:34px;height:34px}
  .stages::before{left:25px}
  .prm-row{grid-template-columns:minmax(0,1fr);gap:2px}
  .prm-k{padding-top:0}
  .axes{gap:19px}
  .ax{grid-template-columns:minmax(0,1fr) auto;gap:5px 14px}
  .ax .name{grid-area:1/1;text-align:left;align-self:baseline}
  .ax .word{grid-area:1/2;text-align:right;align-self:baseline;font-size:15.5px}
  .ax .track{grid-area:2/1/3/3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── главная ── */
.wordmark{cursor:pointer}
.home-hero{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:56px;
  padding:56px 0 8px;align-items:start}
.home-hero .kick{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);margin:0 0 20px}
.home-hero h1{font-size:clamp(44px,5.6vw,74px);line-height:.96;margin:0 0 22px;text-wrap:balance}
.home-hero .say{font-size:21px;line-height:1.5;color:var(--body);max-width:30ch;margin:0 0 30px}
.home-hero .say b{color:var(--ink)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:2px solid var(--ink);padding:13px 20px;font-size:14px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase}
.btn.p{background:var(--green);border-color:var(--green);color:var(--foam);
  border-bottom:5px solid var(--gold)}
.btn.p:hover{background:var(--ink);border-color:var(--ink)}
.btn.s:hover{background:var(--card-light)}

/* пример-витрина */

.demo-in{border:1px solid var(--green-light);background:var(--card-light);padding:22px 24px 24px}

  color:var(--muted);margin:0 0 8px}

/* числа */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:2px;
  background:var(--ink);border:2px solid var(--ink);margin:46px 0 0}

.figs .fig em{font-style:normal;font-size:13px;color:var(--muted);display:block;margin-top:2px}

/* три вещи */
.does{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2px;
  background:var(--line);border:2px solid var(--ink);margin:14px 0 0}
.do{background:var(--card-light);padding:26px 26px 28px}
.do .ic{width:60px;height:60px;border:2px solid var(--ink);background:var(--card);

.band{background:var(--green);color:var(--foam);border-bottom:5px solid var(--gold);
  padding:38px 40px;margin:52px 0 0}
.band h2{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:clamp(26px,3.2vw,34px);

.band p{font-size:17.5px;line-height:1.62;color:var(--green-pale);margin:0 0 14px;max-width:66ch}
.band p:last-child{margin-bottom:0}
.band b{color:var(--foam)}
.band .dot{color:var(--foam);border-bottom:1px dotted var(--gold)}

.nots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px;margin:20px 0 0}
.not h4{font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;

.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;

.door:hover{background:var(--card)}

cký speciál Žitný","plato":11.5,"abv":null,"src":"http://www.unetickypivovar.cz/nase-piva","origin":"the brewery's own site","at":"2026-08-30","ean":null,"venues":3}],"process":[{"h":{"en":"Malt and water become wort","cs":"Ze sladu a vody vzniká mladina"},"b":{"en":"Crushed malt is mixed with hot water so the grain's own enzymes can break its starch into fermentable sugar. Czech breweries do this by <b>decoction</b>: part of the mash is drawn off, boiled separately, and returned to raise the whole batch to the next temperature step. Two or three decoctions are normal here where most of the world uses a single infusion — it is slower, costs more energy, and gives the bready, faintly honeyed malt character that Czech lager is recognised by.","cs":"Šrotovaný slad se smíchá s horkou vodou, aby vlastní enzymy zrna rozštěpily jeho škrob na zkvasitelný cukr. České pivovary to dělají <b>dekokcí</b> — rmutováním: část rmutu se odebere, zvlášť povaří a vrátí zpátky, čímž se celá várka posune na další teplotní stupeň. Dva nebo tři rmuty jsou tu běžné tam, kde zbytek světa používá jedinou infuzi. Je to pomalejší, stojí to víc energie, a dává to sladový chlebový, lehce medový charakter, podle kterého se český ležák pozná."}},{"h":{"en":"The grain is separated out","cs":"Zrno se oddělí"},"b":{"en":"The sweet liquid — <b>wort</b> — is drained off the spent grain, which goes to cattle. What is left in the kettle is sugar, protein and minerals, and no beer yet.","cs":"Sladká tekutina — <b>mladina</b> — se scedí od mláta, které jde dobytku. V pánvi zůstane cukr, bílkoviny a minerální látky, a žádné pivo."}},{"h":{"en":"Boiling with hops","cs":"Chmelovar"},"b":{"en":"The wort is boiled and hops go in, usually in several additions. Early hops give bitterness, late hops give aroma. Czech pale lager leans on <b>Saaz</b> — Žatecký poloraný červeňák — a low-alpha aroma hop with a herbal, faintly spicy character. Its low alpha content is why a Czech 12° can taste firmly bitter without ever tasting resinous the way a modern IPA does.","cs":"Mladina se vaří a přidává se chmel, obvykle na několik dávek. Časný chmel dává hořkost, pozdní aroma. Český světlý ležák stojí na <b>žateckém chmelu</b> — žateckém poloraném červeňáku — aromatické odrůdě s nízkým obsahem alfa kyselin a bylinným, lehce kořenitým charakterem. Právě ten nízký obsah alfa kyselin je důvod, proč česká dvanáctka chutná pevně hořce, aniž by kdy chutnala pryskyřičně jako moderní IPA."}},{"h":{"en":"Cold fermentation with bottom yeast","cs":"Studené kvašení se spodními kvasnicemi"},"b":{"en":"The wort is cooled to around 6 °C, aerated and pitched with lager yeast, which works at the bottom of the vessel and at temperatures an ale yeast would refuse. Primary fermentation runs six to ten days at roughly 8–12 °C. Slow and cold produces a clean profile: none of the banana and clove esters a warm ale ferment throws. Some Czech breweries still use <b>open fermentation vessels</b> — square open-topped tanks in a cold cellar, which is how it was done before the pressure tank.","cs":"Mladina se zchladí zhruba na 6 °C, provzdušní a zakvasí spodními kvasnicemi, které pracují u dna a při teplotách, jaké by svrchní kvasnice odmítly. Hlavní kvašení trvá šest až deset dní zhruba při 8–12 °C. Pomalu a ve studeném vzniká čistý profil: žádné banánové a hřebíčkové estery, jaké hodí teplé svrchní kvašení. Některé české pivovary dodnes používají <b>otevřenou spilku</b> — hranaté otevřené kádě ve studeném sklepě, tak, jak se to dělalo před tlakovým tankem."}},{"h":{"en":"Lagering — the part the beer is named after","cs":"Ležení — část, po které se pivo jmenuje"},"b":{"en":"<em>Lagern</em> is German for &ldquo;to store&rdquo;. The green beer goes into horizontal tanks at about 2 °C and sits there for weeks: three to four for an everyday 10°, six to twelve for a serious 12°, and famously around ninety days at Budvar. During that time it clears, softens, carbonates naturally from residual fermentation, and loses the harsh notes of young beer. This long cold rest is the single biggest difference between traditional Czech lager and industrially accelerated lager.","cs":"<em>Lagern</em> je německy „skladovat“. Mladé pivo jde do ležáckých tanků při zhruba 2 °C a leží tam týdny: tři až čtyři u každodenní desítky, šest až dvanáct u pořádné dvanáctky, a proslulých zhruba devadesát dnů u Budvaru. Za tu dobu se vyčeří, změkne, přirozeně se nasytí oxidem uhličitým a ztratí ostré tóny mladého piva. Tenhle dlouhý studený odpočinek je největší rozdíl mezi tradičním českým ležákem a průmyslově zrychleným."}},{"h":{"en":"Filtered, unfiltered, pasteurised, unpasteurised","cs":"Filtrované, nefiltrované, pasterizované, nepasterizované"},"b":{"en":"These are two separate questions and they are constantly confused. <b>Filtration</b> removes yeast and haze — kieselguhr filtration, sometimes followed by microfiltration. <b>Pasteurisation</b> heats the finished beer to kill what survives, trading some freshness for shelf life. A beer can be filtered but unpasteurised, which is what most &ldquo;nepasterizované&rdquo; on a Czech label means: it has been cleared, but never heated. Tank beer in a pub is normally both unpasteurised and delivered within days.","cs":"Jsou to dvě různé otázky a pořád se pletou. <b>Filtrace</b> odebírá kvasnice a zákal — křemelinová filtrace, někdy následovaná mikrofiltrací. <b>Pasterizace</b> zahřívá hotové pivo, aby zabila, co přežilo, a mění čerstvost za trvanlivost. Pivo může být filtrované a přitom nepasterizované, a přesně to na české etiketě „nepasterizované“ obvykle znamená: bylo vyčeřeno, ale nikdy zahřáto. Tankové pivo v hospodě bývá obojí — nepasterizované a dovezené během pár dnů."}},{"h":{"en":"Why the number on the menu is not alcohol","cs":"Proč číslo na jídelním lístku není alkohol"},"b":{"en":"The degree is <b>degrees Plato</b>: the percentage by weight of dissolved sugar in the wort before fermentation. Yeast converts roughly half of it to alcohol, so the finished strength lands near a third of the number — an 11° comes out around 4.6 %. Breweries can also push the balance: adding a little sugar to the boil raises the alcohol without adding body, which is how some 11° beers stay unusually light on the palate.","cs":"Ten stupeň je <b>stupeň Plato</b>: hmotnostní procento rozpuštěného cukru v mladině před kvašením. Kvasnice zhruba polovinu promění v alkohol, takže výsledná síla vyjde okolo třetiny toho čísla — jedenáctka skončí kolem 4,6 %. Pivovar může tu rovnováhu i posunout: trocha cukru do varny zvedne alkohol, aniž přidá plnost, a právě proto některé jedenáctky zůstávají v ústech nezvykle lehké."}}],"breweries":[{"id":"plzensky-prazdroj","name":"Plzeňský Prazdroj","nameEn":"Plzeňský Prazdroj","city":"Plzeň","founded":1842,"site":"https://www.pilsnerurquell.com/","wikidata":"Q948831","stub":false,"foreign":false,"curated":[],"story":{"en":"The brewery that invented pale lager. In 1842 the burghers of Plzeň, fed up with undrinkable beer, hired a Bavarian brewer, dug cellars into sandstone and produced the first golden bottom-fermented beer anyone had seen. Every lager on earth is descended from what came out of those cellars.","cs":"Pivovar, který vynalezl světlý ležák. Roku 1842 měli plzeňští měšťané dost nepitelného piva, najali bavorského sládka, vyhloubili sklepy do pískovce a uvařili první zlatavé spodně kvašené pivo, jaké kdo viděl. Každý ležák na světě je potomkem toho, co vyšlo z těch sklepů."},"notes":[{"h":{"en":"Why it still matters to a visitor","cs":"Proč to dnes zajímá návštěvníka"},"b":{"en":"Almost every Czech pale lager you will be offered defines itself against this one — softer than it, maltier than it, more bitter than it. Drink it early in the trip and the rest of the menu becomes readable.","cs":"Skoro každý český světlý ležák, který vám nabídnou, se vůči tomuhle vymezuje — měkčí než on, sladovější než on, hořčejší než on. Vypijte ho na začátku cesty a zbytek jídelního lístku začne dávat smysl."}},{"h":{"en":"Tank pubs are worth seeking out","cs":"Za tankovými hospodami stojí za to jít"},"b":{"en":"Unpasteurised tank beer is a different, fuller drink than the bottled version, and pubs that pour it say so on the door. It usually costs the same.","cs":"Nepasterizované tankové pivo je jiný, plnější nápoj než to lahvové, a hospody, které ho čepují, to dávají na dveře. Obvykle stojí stejně."}}],"venues":10},{"id":"pivovar-velke-popovice","name":"Pivovar Velké Popovice","nameEn":"Velké Popovice Brewery","city":"Velké Popovice","founded":1874,"site":"http://www.kozel.cz/","wikidata":"Q12045442","stub":false,"foreign":false,"curated":[],"story":{"en":"The goat brewery, twenty minutes south-east of Prague, brewing since 1874. Owned by the same group as Pilsner Urquell and deliberately positioned as its opposite: softer, sweeter, easier, with the bitterness turned down.","cs":"Kozlí pivovar dvacet minut jihovýchodně od Prahy, vaří od roku 1874. Patří stejné skupině jako Prazdroj a je záměrně stavěný jako jeho protiklad: měkčí, sladší, snadnější, s hořkostí staženou dolů."},"notes":[{"h":{"en":"The dark one is the famous one","cs":"Slavné je to tmavé"},"b":{"en":"Kozel Černý is the dark beer most visitors to Prague meet first, and the one most often mistaken for a stout. It is a sweet, low-alcohol lager — good on its own terms, and nothing like Guinness.","cs":"Kozel Černý je tmavé pivo, se kterým se většina návštěvníků Prahy potká jako s prvním, a nejčastěji zaměňované za stout. Je to sladký slabý ležák — dobrý sám o sobě a Guinnessu nepodobný."}}],"venues":9},{"id":"pivovar-gambrinus-plzen","name":"Pivovar Gambrinus Plzeň","nameEn":"Gambrinus","city":"Plzeň","founded":null,"site":"http://www.gambrinus.cz/cz/","wikidata":"Q18042636","stub":false,"foreign":false,"curated":[],"story":{"en":"Brewed alongside Pilsner Urquell in Plzeň and, by volume, the beer Czechs actually drink. Unfashionable and everywhere — the pour you get in an ordinary neighbourhood pub when you just ask for beer.","cs":"Vaří se v Plzni vedle Prazdroje a objemem je to pivo, které Češi opravdu pijí. Nemoderní a všude — to, co dostanete v obyčejné hospodě, když si řeknete jen o pivo."},"notes":[],"venues":7},{"id":"pivovary-staropramen","name":"Pivovary Staropramen","nameEn":"Pivovary Staropramen","city":"Praha","founded":1869,"site":"https://staropramen.cz","wikidata":"Q12045462","stub":false,"foreign":false,"curated":["founded"],"story":{"en":"Prague's own big brewery, on the Smíchov bank of the Vltava since 1869. The name means &ldquo;old spring&rdquo;. It is the beer of the city in the plainest sense: brewed here, drunk here, and rarely thought about by anyone who lives here.","cs":"Vlastní velký pivovar Prahy, na smíchovském břehu Vltavy od roku 1869. Je to pivo města v nejprostším smyslu: vařené tady, pité tady, a málokdo z místních nad ním přemýšlí."},"notes":[{"h":{"en":"What to order","cs":"Co si objednat"},"b":{"en":"If a pub carries both the 10° and the 12°, take the 12° — the extra malt is where the beer becomes interesting. The amber Granát is the best answer to &ldquo;something darker but not heavy&rdquo;.","cs":"Pokud hospoda čepuje desítku i dvanáctku, berte dvanáctku — ten slad navíc je místo, kde pivo začíná být zajímavé. Polotmavý Granát je nejlepší odpověď na „něco tmavšího, ale ne těžkého“."}}],"venues":5},{"id":"breznak","name":"Březňák","nameEn":null,"city":"Velké Březno","founded":null,"site":null,"wikidata":null,"stub":true,"foreign":false,"curated":["city"],"story":{"en":"A North Bohemian brand from Velké Březno with a working-town reputation the brewery has never tried to shake. Firm, dry bitterness and no pretence.","cs":"Severočeská značka z Velkého Března s pověstí dělnického města, které se pivovar nikdy nesnažil zbavit. Pevná suchá hořkost a žádné pózy."},"notes":[],"venues":3},{"id":"pivovar-svijany","name":"Pivovar Svijany","nameEn":"Svijany Brewery","city":"Svijany","founded":1564,"site":"http://www.pivovarsvijany.cz/index.php","wikidata":"Q3508302","stub":false,"foreign":false,"curated":[],"story":{"en":"A regional brewery in a village in the Liberec region, brewing on and off since 1564 and in its current form since the 1990s. It occupies the middle ground of Czech beer: never went industrial, never went craft, and built a tied network of pubs across Bohemia — a dozen of them in Prague.","cs":"Regionální pivovar ve vsi na Liberecku, vaří s přestávkami od roku 1564 a v dnešní podobě od devadesátých let. Obsazuje střed českého piva: nikdy nešel do průmyslu, nikdy do řemesla, a vybudoval síť smluvních hospod po Čechách — tucet z nich v Praze."},"notes":[{"h":{"en":"Why Czechs are loyal to it","cs":"Proč mu Češi zůstávají věrní"},"b":{"en":"Svijany is the beer a Czech names when asked what they drink instead of the big three. Cheap enough for an everyday pub, small enough to feel local, and it avoided the ownership churn Czechs hold against the industrial brands.","cs":"Svijany jsou pivo, které Čech jmenuje, když se ho zeptáte, co pije místo velké trojky. Dost levné na každodenní hospodu, dost malé na to, aby působilo místně, a vyhnulo se změnám vlastníků, které Češi průmyslovým značkám vyčítají."}}],"venues":3},{"id":"uneticky-pivovar","name":"Únětický pivovar","nameEn":"Únětický pivovar","city":"Únětice","founded":2010,"site":"http://www.unetickypivovar.cz/o-pivovaru","wikidata":"Q11086998","stub":false,"foreign":false,"curated":[],"story":{"en":"A village brewery eight kilometres outside Prague, closed under communism and restarted in 2011 by locals who wanted their beer back. Unfiltered, unpasteurised and quietly revered — the beer Prague beer people name when they want to sound unpretentious.","cs":"Vesnický pivovar osm kilometrů za Prahou, za socialismu zavřený a v roce 2011 znovu spuštěný místními, kteří chtěli své pivo zpátky. Nefiltrované, nepasterizované a tiše uctívané — pivo, které pražští pivní lidé jmenují, když nechtějí působit nafoukaně."},"notes":[{"h":{"en":"Worth the trip","cs":"Stojí to za výlet"},"b":{"en":"The brewery pub in Únětice is a bus ride from Dejvická and a genuinely local afternoon. In Prague itself the beer turns up in a handful of pubs that take beer seriously.","cs":"Pivovarská hospoda v Úněticích je autobusem od Dejvické a je to opravdové místní odpoledne. V Praze samotné se pivo objevuje v hrstce hospod, které to s pivem myslí vážně."}}],"venues":3},{"id":"pivovar-radegast","name":"Pivovar Radegast","nameEn":"Pivovar Radegast","city":"Nošovice","founded":null,"site":"https://www.radegast.cz","wikidata":"Q12045427","stub":false,"foreign":false,"curated":[],"story":{"en":"From Nošovice in Moravian Silesia, named after a Slavic god and marketed on bitterness in a country that markets everything else on smoothness. The driest of the big Czech lagers, and the one to reach for if Pilsner Urquell felt too soft.","cs":"Z Nošovic ve Slezsku, pojmenovaný po slovanském bohu, a prodávaný na hořkosti v zemi, kde se všechno ostatní prodává na jemnosti. Nejsušší z velkých českých ležáků a ten, po kterém sáhnout, když vám Prazdroj přišel příliš měkký."},"notes":[],"venues":2},{"id":"budejovicky-budvar","name":"Budějovický Budvar","nameEn":"Budweiser Budvar","city":"České Budějovice","founded":1895,"site":"http://www.budvar.cz/","wikidata":"Q1001644","stub":false,"foreign":false,"curated":[],"story":{"en":"From České Budějovice — Budweis in German — and one of the last large Czech breweries still owned by the state. Rounder and slower than a Plzeň lager, with a long malty finish rather than a sharp one.","cs":"Z Českých Budějovic, německy Budweis, a jeden z posledních velkých českých pivovarů v rukou státu. Kulatější a pomalejší než plzeňský ležák, s dlouhým sladovým závěrem místo ostrého."},"notes":[{"h":{"en":"The Budweiser name","cs":"Proč se nejmenuje Budweiser všude"},"b":{"en":"The brewery has been in a trademark fight with the American Anheuser-Busch brand for over a century. In much of Europe the Czech beer is Budweiser; in the United States it is sold as Czechvar. The two beers have nothing in common but the name.","cs":"Pivovar vede spor o ochrannou známku s americkou značkou Anheuser-Busch přes sto let. Ve velké části Evropy je Budweiser české pivo, ve Spojených státech se prodává jako Czechvar. Kromě jména nemají obě piva společného nic."}}],"venues":1},{"id":"guinness","name":"Guinness","nameEn":null,"city":null,"founded":null,"site":null,"wikidata":null,"stub":true,"foreign":true,"curated":[],"story":{"en":"Not a Czech brewery. Guinness appears here because a Prague venue pours it, and because it is the reference point almost every visitor uses when ordering a dark beer — usually to their disappointment, since Czech dark lager is a different drink entirely.","cs":"Není to český pivovar. Guinness je tu proto, že ho jeden pražský podnik čepuje, a proto, že je to bod srovnání, který skoro každý návštěvník používá při objednávání tmavého piva — obvykle ke svému zklamání, protože český tmavý ležák je docela jiný nápoj."},"notes":[],"venues":1},{"id":"hubertus","name":"Hubertus","nameEn":null,"city":"Kácov","founded":null,"site":null,"wikidata":null,"stub":true,"foreign":false,"curated":["city"],"story":{"en":"From Kácov on the Sázava, in a valley of weekend cottages. Soft, malty beer for a long evening rather than for study.","cs":"Z Kácova na Sázavě, v údolí chat. Měkké sladové pivo na dlouhý večer, ne ke studiu."},"notes":[],"venues":1},{"id":"konrad","name":"Konrád","nameEn":null,"city":"Vratislavice nad Nisou","founded":null,"site":null,"wikidata":null,"stub":true,"foreign":false,"curated":["city"],"story":{"en":"From Vratislavice nad Nisou near Liberec. Balanced lagers that lean neither sweet nor aggressively bitter — the sort a pub keeps because regulars never complain.","cs":"Z Vratislavic nad Nisou u Liberce. Vyvážené ležáky, které netíhnou ke sladkosti ani k agresivní hořkosti — takové, jaké si hospoda drží, protože si na ně štamgasti nestěžují."},"notes":[],"venues":1},{"id":"kralovsky-pivovar-krusovice","name":"Královský pivovar Krušovice","nameEn":"Royal Brewery of Krušovice","city":"Krušovice","founded":1581,"site":"http://www.krusovice.cz/","wikidata":"Q1796123","stub":false,"foreign":false,"curated":[],"story":{"en":"A royal brewery by charter — Rudolf II bought it in 1583 — and a mass-market lager in practice. Soft and sweetish, and more common in tourist-facing places in the centre than in neighbourhood pubs.","cs":"Královský pivovar podle listiny — Rudolf II. ho koupil roku 1583 — a masový ležák v praxi. Měkký a nasládlý, a v turistických podnicích v centru častější než v hospodách po sídlištích."},"notes":[],"venues":1},{"id":"matuska","name":"Matuška","nameEn":null,"city":"Broumy","founded":null,"site":null,"wikidata":null,"stub":true,"foreign":false,"curated":["city"],"story":{"en":"The brewery that started Czech craft. Founded in Broumy in 2009 by a father and son who had been brewing at home, and the first to show Czech drinkers what American hops do to a beer.","cs":"Pivovar, kterým začalo české řemeslné pivo. Založený v Broumech roku 2009 otcem a synem, kteří do té doby vařili doma, a první, který českým pijákům ukázal, co s pivem dělá americký chmel."},"notes":[{"h":{"en":"Where to start","cs":"Čím začít"},"b":{"en":"Raptor is the reference Czech IPA and hits hard after a week of lager. Zlatá raketa is the same hop character turned down enough to have two.","cs":"Raptor je referenční česká IPA a po týdnu ležáků udeří. Zlatá raketa je stejný chmelový charakter ztlumený natolik, aby se dala dát dvě."}}],"venues":1},{"id":"pivovar-branik","name":"Pivovar Braník","nameEn":"Braník Brewery","city":"Praha","founded":1898,"site":null,"wikidata":"Q12045379","stub":false,"foreign":false,"curated":["city"],"story":{"en":"Once Prague's own brewery on the right bank of the Vltava, opened in 1900 and closed as a working site in 2007. The brand survived and is still poured in the city, carrying more local sentiment than the beer itself strictly earns.","cs":"Kdysi vlastní pražský pivovar na pravém břehu Vltavy, otevřený roku 1900 a jako provoz zavřený v roce 2007. Značka přežila a v městě se pořád čepuje, nese víc místního sentimentu, než si samo pivo přísně vzato zaslouží."},"notes":[],"venues":1},{"id":"pivovar-cvikov","name":"Pivovar Cvikov","nameEn":"Pivovar Cvikov","city":"Liberec","founded":2014,"site":"https://www.pivovarcvikov.cz","wikidata":"Q15269165","stub":false,"foreign":false,"curated":[],"story":{"en":"A small North Bohemian brewery near the glassworks its beers are named after. Dry, firmly hopped, and a good example of what a regional 11° is supposed to taste like.","cs":"Malý severočeský pivovar u sklárny, po níž se jeho piva jmenují. Suché, pevně chmelené, a dobrý příklad toho, jak má chutnat regionální jedenáctka."},"notes":[],"venues":1},{"id":"pivovar-klaster","name":"Pivovar Klášter","nameEn":"Pivovar Klášter","city":"Klášter Hradiště nad Jizerou","founded":1997,"site":null,"wikidata":"Q12045402","stub":false,"foreign":false,"curated":[],"story":{"en":"A monastery brewery at Klášter Hradiště nad Jizerou, founded by Cistercians and brewing in one form or another since the sixteenth century. Soft, malt-forward beer that pubs keep when they want something other than the big four.","cs":"Klášterní pivovar v Klášteře Hradišti nad Jizerou, založený cisterciáky a vařící v nějaké podobě od šestnáctého století. Měkké, sladové pivo, které si hospody drží, když chtějí něco jiného než velkou čtyřku."},"notes":[],"venues":1},{"id":"pivovar-prokopak","name":"Pivovar Prokopák","nameEn":"Pivovar Prokopák","city":"Praha","founded":null,"site":null,"wikidata":"Q105393405","stub":false,"foreign":false,"curated":["city"],"story":{"en":"A small Prague brewpub in Nové Butovice, brewing for its own tables. Local in the most literal sense — the beer exists mainly where it is made.","cs":"Malý pražský pivovar v Nových Butovicích, vaří pro vlastní stoly. Místní v nejdoslovnějším smyslu — pivo existuje hlavně tam, kde se dělá."},"notes":[],"venues":1},{"id":"pivovar-rychtar","name":"Pivovar Rychtář","nameEn":null,"city":"Hlinsko","founded":null,"site":"http://www.rychtar.cz/","wikidata":"Q18114144","stub":false,"foreign":false,"curated":[],"story":{"en":"From Hlinsko in the Bohemian-Moravian highlands. A regional name that Prague pubs put on the tap when they want something recognisably not corporate.","cs":"Z Hlinska na Českomoravské vrchovině. Regionální jméno, které pražské hospody dávají na pípu, když chtějí něco rozpoznatelně nekorporátního."},"notes":[],"venues":1},{"id":"pivovar-zichovec","name":"Pivovar Zichovec","nameEn":"Pivovar Zichovec","city":"Louny","founded":2012,"site":"https://pivovarzichovec.cz/","wikidata":"Q120871109","stub":false,"foreign":false,"curated":[],"story":{"en":"A revived village brewery in central Bohemia that became one of the loudest names in Czech craft — heavy on collaborations, sours and one-offs alongside a straight lager.","cs":"Obnovený vesnický pivovar ve středních Čechách, který se stal jedním z nejhlasitějších jmen českého řemesla — hodně spoluprací, kyselých piv a jednorázovek vedle přímočarého ležáku."},"notes":[{"h":{"en":"Nothing listed here yet","cs":"Zatím tu nic není"},"b":{"en":"We have not collected this brewery's range. Under the publishing rule the brewery gets a page and its beers do not, until each one has a source and somewhere in Prague to drink it.","cs":"Sortiment tohoto pivovaru jsme nesebrali. Podle pravidla publikace dostane pivovar stránku a jeho piva ne, dokud každé nebude mít zdroj a místo v Praze, kde se dá vypít."}}],"venues":1},{"id":"pivovar-cerna-hora","name":"Pivovar Černá Hora","nameEn":"Černá Hora Brewery","city":"Černá Hora","founded":2008,"site":"http://www.pivovarcernahora.cz","wikidata":"Q12045453","stub":false,"foreign":false,"curated":[],"story":{"en":"One of the older Moravian breweries, documented from the sixteenth century, in a village north of Brno. Dependable middle-of-the-road lagers, increasingly poured in Prague.","cs":"Jeden ze starších moravských pivovarů, doložený od šestnáctého století, ve vsi severně od Brna. Spolehlivé ležáky středního proudu, čím dál častěji čepované i v Praze."},"notes":[],"venues":1},{"id":"restaurace-a-pivovar-beer-factory","name":"Restaurace a pivovar Beer Factory","nameEn":"Beer Factory Brewery","city":"Plzeň","founded":2016,"site":"http://www.beerfactoryplzen.cz/","wikidata":"Q27918397","stub":false,"foreign":false,"curated":[],"story":{"en":"A Prague brewpub brewing on the premises. Worth knowing that it exists rather than planning an evening around it.","cs":"Pražský podnik vařící na místě. Stojí za to vědět, že existuje, spíš než kolem něj plánovat večer."},"notes":[],"venues":1},{"id":"stella-artois","name":"Stella Artois","nameEn":null,"city":null,"founded":null,"site":null,"wikidata":null,"stub":true,"foreign":true,"curated":[],"story":{"en":"Not a Czech brewery. Listed because a Prague venue pours it and because it is a useful yardstick: everything Czech here is maltier, and above the 10° mark considerably more bitter.","cs":"Není to český pivovar. Uvedena proto, že ji jeden pražský podnik čepuje, a jako užitečné měřítko: všechno české tady je sladovější a nad desítkou i podstatně hořčejší."},"notes":[],"venues":1},{"id":"vinohradsky-pivovar","name":"Vinohradský pivovar","nameEn":"Vinohradský pivovar","city":"Praha","founded":2013,"site":"https://www.vinohradskypivovar.cz/","wikidata":"Q116891142","stub":false,"foreign":false,"curated":[],"story":{"en":"A Prague brewpub in Vinohrady, brewing on site since 2014 in a neighbourhood that had lost its brewery a century earlier. The kind of place where the beer travels ten metres from tank to glass.","cs":"Pražský pivovarský podnik na Vinohradech, vaří na místě od roku 2014 ve čtvrti, která o svůj pivovar přišla o století dřív. Místo, kde pivo urazí z tanku do sklenice deset metrů."},"notes":[],"venues":1}],"venues":[{"id":"osm-n2401706630","n":"(A) ořkost, která doznívá, a slad pod ní zůstává suchý. Vedle mezinárodního ležáku to první dva doušky působí přísně — a pak už nikdy."}},{"h":{"en":"Tank and bottle are not the same drink","cs":"Tank a láhev nejsou totéž"},"b":{"en":"Unpasteurised tank beer — <em>tankové</em> — is softer, fuller and noticeably fresher. Pubs that pour it advertise it, because it costs them more. It is the single biggest upgrade available to a visitor and usually costs nothing extra.","cs":"Nepasterizované tankové pivo je měkčí, plnější a znatelně čerstvější. Hospody, které ho čepují, to dávají na dveře, protože je stojí víc. Pro návštěvníka je to největší dostupný rozdíl a obvykle nestojí nic navíc."}}],"prod":{"en":{"attenuation":{"oe":12,"ae":3.5,"adf":71},"ingredients":[{"k":"Water","v":"Soft Plzeň water, very low in mineral salts — the reason the hop bitterness lands clean rather than harsh.","icon":"drop","lvl":"brewery"},{"k":"Malt","v":"Moravian floor-malted barley.","icon":"grain","lvl":"brewery"},{"k":"Hops","v":"Saaz (Žatecký poloraný červeňák), whole cone.","icon":"hop","lvl":"brewery"}],"maltLine":"A straightforward pale grist — Czech Pilsner malt doing all the work, which is the hardest kind of beer to hide anything in.","stages":[{"id":"mash","name":"Mashing","what":"Starch becomes sugar","body":"Crushed malt meets hot water and the grain's own enzymes cut its starch into fermentable sugar. The result is <b>wort</b>: sweet, hopless, not yet beer.","params":[{"k":"Mashing","v":"Triple decoction — three separate portions of mash boiled and returned. Almost nobody does this at scale any more.","lvl":"brewery"}],"note":null,"days":null},{"id":"boil","name":"Boil and hops","what":"Bitterness and aroma arrive","body":"The wort is boiled and hops go in. Early additions give bitterness, late ones give aroma. Nothing else in the process adds either.","params":[{"k":"Hops","v":"Saaz (Žatecký poloraný červeňák), whole cone.","lvl":"brewery"}],"note":"Firmly hopped by international standards and normal by Czech ones. Saaz is low in alpha acid, so it is used generously — the bitterness lingers without ever turning resinous.","days":null},{"id":"ferment","name":"Fermentation","what":"Sugar becomes alcohol","body":"Cooled to about 6 °C and pitched with bottom-fermenting yeast. Sugar turns into alcohol and CO₂; cold and slow keeps the profile clean.","params":[{"k":"Fermentation","v":"Historically open vessels in the sandstone cellars; a small parallel batch is still fermented and lagered there in wooden barrels for comparison.","lvl":"brewery"}],"note":"Fermentation stopped comparatively early, near <b>71&nbsp;%</b>, and about <b>3.5°</b> stayed in the beer. That unfermented malt is what you feel as body, and it is why this tastes fuller than beers of the same strength.","days":[6,10]},{"id":"lager","name":"Lagering","what":"Time does the rest","body":"The green beer rests cold in horizontal tanks. It clears, softens, carbonates naturally and loses the harshness of young beer. This is the step industrial brewing cuts first.","params":[{"k":"Lagering temperature","v":"≈ 2 °C","lvl":"style"},{"k":"Lagering time","v":"weeks, in horizontal tanks","lvl":"brewery"}],"note":null,"days":[21,45]},{"id":"finish","name":"Finishing","what":"Clearing and packaging","body":"Filtration removes yeast and haze. Pasteurisation — heating the finished beer — is a separate decision, and plenty of Czech beer skips it.","params":[{"k":"Filtration","v":"Filtered for bottle and can; tank beer is delivered unfiltered of character and unpasteurised.","lvl":"brewery"}],"note":null,"days":null}],"timeline":{"brew":1,"ferment":8.0,"lager":33.0,"fermentLabel":"6–10 days","lagerLabel":"21–45 days","total":42,"lvl":"style"},"note":"The cellar comparison batch is the reason the brewery can tell you what it is supposed to taste like. If you take the brewery tour in Plzeň, the unfiltered, unpasteurised beer straight from a cellar barrel is the whole point of going.","hasBrewery":true,"allBrewery":false},"cs":{"attenuation":{"oe":12,"ae":3.5,"adf":71},"ingredients":[{"k":"Voda","v":"Měkká plzeňská voda s velmi nízkým obsahem minerálních solí — díky ní dosedá chmelová hořkost čistě, ne drsně.","icon":"drop","lvl":"brewery"},{"k":"Slad","v":"Moravský humnový ječný slad.","icon":"grain","lvl":"brewery"},{"k":"Chmel","v":"Žatecký chmel (žatecký poloraný červeňák), hlávkový.","icon":"hop","lvl":"brewery"}],"maltLine":"Přímočará světlá sypanina — český plzeňský slad dělá všechnu práci, a to je nejtěžší druh piva, ve kterém se dá něco schovat.","stages":[{"id":"mash","name":"Rmutování","what":"Ze škrobu vzniká cukr","body":"Šrotovaný slad se potká s horkou vodou a vlastní enzymy zrna rozštěpí jeho škrob na zkvasitelný cukr. Výsledkem je <b>mladina</b>: sladká, bez chmele, ještě ne pivo.","params":[{"k":"Rmutování","v":"Třírmutová dekokce — tři oddělené části rmutu se povaří a vrátí. Ve velkém to už skoro nikdo nedělá.","lvl":"brewery"}],"note":null,"days":null},{"id":"boil","name":"Chmelovar","what":"Přichází hořkost a aroma","body":"Mladina se vaří a přidává se chmel. Časné dávky dají hořkost, pozdní aroma. Nic jiného v procesu ani jedno nepřidá.","params":[{"k":"Chmel","v":"Žatecký chmel (žatecký poloraný červeňák), hlávkový.","lvl":"brewery"}],"note":"Podle mezinárodních měřítek pevně chmeleno, podle českých normálně. Žatecký chmel má málo alfa kyselin, a tak se ho dává štědře — hořkost doznívá, aniž by kdy zpryskyřičněla.","days":null},{"id":"ferment","name":"Hlavní kvašení","what":"Z cukru vzniká alkohol","body":"Zchlazeno zhruba na 6 °C a zakvašeno spodními kvasnicemi. Cukr se mění na alkohol a oxid uhličitý; chlad a pomalost drží profil čistý.","params":[{"k":"Kvašení","v":"Historicky otevřené kádě v pískovcových sklepích; malá souběžná várka se tam dodnes zakvašuje a leží v dřevěných sudech pro srovnání.","lvl":"brewery"}],"note":"Kvašení se zastavilo poměrně brzy, kolem <b>71&nbsp;%</b>, a v pivu zůstalo asi <b>3.5°</b>. Ten nezkvašený slad cí  spíš čisté než suché."},"notes":[{"h":{"en":"Is it like Guinness?","cs":"Je to jako Guinness?"},"b":{"en":"No, and this is the most common disappointment in Prague. Guinness is dry, thin-bodied and poured with nitrogen; Kozel Černý is a sweet lager with caramel malt and normal carbonation. If you came for a stout, the closest thing on most Czech taps is a <em>tmavý speciál</em> at 13° — and you will usually have to leave the tourist centre to find one.","cs":"Ne, a tohle je nejčastější zklamání v Praze. Guinness je suchý, tenký a čepuje se dusíkem; Kozel Černý je sladký ležák s karamelovým sladem a běžným nasycením. Kdo přišel pro stout, najde na běžných českých pípách nejblíž <em>tmavý speciál</em> okolo třinácti stupňů — a obvykle bude muset opustit turistické centrum."}}],"prod":{"en":{"attenuation":{"oe":10,"ae":2.6,"adf":74},"ingredients":[{"k":"Malt","v":"Pale malt with caramel and roasted malts. The caramel malt is doing most of the work: it brings colour and sweetness but very little of the dry roast a stout gets from roasted barley.","icon":"grain","lvl":"brewery"},{"k":"Hops","v":"Saaz, restrained.","icon":"hop","lvl":"brewery"}],"maltLine":"Colour and the coffee note come from roasted and caramel malt on a pale base. Caramel malt brings sweetness with the colour, roasted malt brings the dry edge — which of the two leads is the whole difference between a Czech dark lager and a stout.","stages":[{"id":"mash","name":"Mashing","what":"Starch becomes sugar","body":"Crushed malt meets hot water and the grain's own enzymes cut its starch into fermentable sugar. The result is <b>wort</b>: sweet, hopless, not yet beer.","params":[{"k":"Mashing","v":"Decoction.","lvl":"style"}],"note":null,"days":null},{"id":"boil","name":"Boil and hops","what":"Bitterness and aroma arrive","body":"The wort is boiled and hops go in. Early additions give bitterness, late ones give aroma. Nothing else in the process adds either.","params":[{"k":"Hops","v":"Saaz, restrained.","lvl":"brewery"}],"note":"Hopped for balance rather than statement. The Saaz character shows in the aroma more than in the finish.","days":null},{"id":"ferment","name":"Fermentation","what":"Sugar becomes alcohol","body":"Cooled to about 6 °C and pitched with bottom-fermenting yeast. Sugar turns into alcohol and CO₂; cold and slow keeps the profile clean.","params":[{"k":"Fermentation","v":"Lager yeast, 8–12 °C.","lvl":"style"}],"note":"Fermentation stopped comparatively early, near <b>74&nbsp;%</b>, and about <b>2.6°</b> stayed in the beer. That unfermented malt is what you feel as body, and it is why this tastes fuller than beers of the same strength.","days":[6,10]},{"id":"lager","name":"Lagering","what":"Time does the rest","body":"The green beer rests cold in horizontal tanks. It clears, softens, carbonates naturally and loses the harshness of young beer. This is the step industrial brewing cuts first.","params":[{"k":"Lagering temperature","v":"≈ 2 °C","lvl":"style"},{"k":"Lagering time","v":"several weeks","lvl":"style"}],"note":null,"days":[21,45]},{"id":"finish","name":"Finishing","what":"Clearing and packaging","body":"Filtration removes yeast and haze. Pasteurisation — heating the finished beer — is a separate decision, and plenty of Czech beer skips it.","params":[],"note":null,"days":null}],"timeline":{"brew":1,"ferment":8.0,"lager":33.0,"fermentLabel":"6–10 days","lagerLabel":"21–45 days","total":42,"lvl":"style"},"note":"This is the technical reason it disappoints people expecting Guinness. A dry stout gets its character from unmalted roasted barley and a nitrogen pour; this gets its character from caramel malt and normal CO₂.","hasBrewery":true,"allBrewery":false},"cs":{"attenuation":{"oe":10,"ae":2.6,"adf":74},"ingredients":[{"k":"Slad","v":"Světlý slad s karamelovými a praženými slady. Většinu práce dělá karamelový slad: přináší barvu a sladkost, ale skoro nic ze suché praženosti, kterou stout dostává z praženého ječmene.","icon":"grain","lvl":"brewery"},{"k":"Chmel","v":"Žatecký chmel, držený zkrátka.","icon":"hop","lvl":"brewery"}],"maltLine":"Barva a kávový tón pocházejí z pražených a karamelových sladů na světlém základu. Karamelový slad přináší sladkost s barvou, pražený suchou hranu — a který z nich vede, je celý rozdíl mezi českým tmavým ležákem a stoutem.","stages":[{"id":"mash","name":"Rmutování","what":"Ze škrobu vzniká cukr","body":"Šrotovaný slad se potká s horkou vodou a vlastní enzymy zrna rozštěpí jeho škrob na zkvasitelný cukr. Výsledkem je <b>mladina</b>: sladká, bez chmele, ještě ne pivo.","params":[{"k":"Rmutování","v":"Dekokce.","lvl":"style"}],"note":null,"days":null},{"id":"boil","name":"Chmelovar","what":"Přichází hořkost a aroma","body":"Mladina se vaří a přidává se chmel. Časné dávky dají hořkost, pozdní aroma. Nic jiného v procesu ani jedno nepřidá.","params":[{"k":"Chmel","v":"Žatecký chmel, držený zkrátka.","lvl":"brewery"}],"note":"Chmeleno spíš pro rovnováhu než pro efekt. Žatecký charakter se ozve víc v aromatu než v závěru.","days":null},{"id":"ferment","name":"Hlavní kvašení","what":"Z cukru vzniká alkohol","body":"Zchlazeno zhruba na 6 °C a zakvašeno spodními kvasnicemi. Cukr se mění na alkohol a oxid uhličitý; chlad a pomalost drží profil čistý.","params":[{"k":"Kvašení","v":"Spodní kvasnice, 8–12 °C.","lvl":"style"}],"note":"Kvašení se zastavilo poměrně brzy, kolem <b>74&nbsp;%</b>, a v pivu zůstalo asi <b>2.6°</b>. Ten nezkvašený slad cítíte jako plnost, a proto tohle chutná plněji než piva stejné síly.","days":[6,10]},{"id":"lager","name":"Ležení","what":"Zbytek udělá čas","body":"Mladé pivo odpočívá ve studených ležáckých tancích. Čeří se, měkne, přirozeně se nasycuje a ztrácí ostrost mladého piva. Tenhle krok průmyslové vaření zkracuje jako první.","params":[{"k":"Teplota ležení","v":"≈ 2 °C","lvl":"style"},{"k":"Doba ležení","v":"několik týdnů","lvl":"style"}],"note":null,"days":[21,45]},{"id":"finish","name":"Dokončení","what":"Čeření a stáčení","body":"Filtrace odebere kvasnice a zákal. Pasterizace — zahřátí hotového piva — je samostatné rozhodnutí, a spousta českého piva se jí vyhýbá.","params":[],"note":null,"days":null}],"timeline":{"brew":1,"ferment":8.0,"lager":33.0,"fermentLabel":"6–10 dní","lagerLabel":"21–45 dní","total":42,"lvl":"style"},"note":"Tohle je technický důvod, proč lidi zklame, když čekají Guinness. Suchý stout má charakter z nesladovaného praženého ječmene a dusíkového čepování; tohle ho má z karamelového sladu a běžného oxidu uhličitého.","hasBrewery":true,"allBrewery":false}},"anchor":false,"venues":9},{"id":"gambrinus-original-10","breweryId":"pivovar-gambrinus-plzen","name":"Gambrinus Originál 10","cs":"Gambrinus 10°","style":"Czech pale lager","plato":10,"abv":4.1,"f":[4,5,4,5,1,2,1,3,1],"like":[],"lead":{"en":"By volume, the beer Czechs actually drink. Unfashionable, cheap and everywhere — the pour you get when you walk into an ordinary neighbourhood pub and just say <em>pivo</em>.","cs":"Objemem pivo, které Češi opravdu pijí. Nemoderní, levné a všude — to, co dostanete, když vejdete do obyčejné hospody a řeknete jen <em>pivo</em>."},"notes":[],"prod":{"en":{"attenuation":{"oe":10,"ae":2.1,"adf":79},"ingredients":[{"k":"Malt","v":"Czech barley malt, usually pale Pilsner malt alone.","icon":"grain","lvl":"style"},{"k":"Hops","v":"Saaz.","icon":"hop","lvl":"brewery"}],"maltLine":"A straightforward pale grist — Czech Pilsner malt doing all the work, which is the hardest kind of beer to hide anything in.","stages":[{"id":"mash","name":"Mashing","what":"Starch becomes sugar","body":"Crushed malt meets hot water and the grain's own enzymes cut its starch into fermentable sugar. The result is <b>wort</b>: sweet, hopless, not yet beer.","params":[{"k":"Mashing","v":"Decoction.","lvl":"brewery"}],"note":null,"days":null},{"id":"boil","name":"Boil and hops","what":"Bitterness and aroma arrive","body":"The wort is boiled and hops go in. Early additions give bitterness, late ones give aroma. Nothing else in the process ":12,"abv":4.6,"f":[4,7.5,6,4,7,2.5,1,2.5,1],"like":["the dark beer people wanted when they ordered Kozel Černý"],"lead":{"en":"The dark beer most visitors were hoping for when they ordered Kozel Černý: drier, properly roasted, with real coffee and dark bread rather than caramel syrup. Harder to find, and worth the walk.","cs":"Tmavé pivo, ve které většina návštěvníků doufala, když si objednala Kozla Černého: sušší, pořádně pražené, s opravdovou kávou a tmavým chlebem místo karamelového sirupu. Hůř k sehnání a stojí to za tu procházku."},"notes":[],"prod":{"en":{"attenuation":{"oe":12,"ae":3.1,"adf":74},"ingredients":[{"k":"Malt","v":"Pale barley malt with roasted and caramel malts for colour and the coffee note.","icon":"grain","lvl":"brewery"},{"k":"Hops","v":"Saaz, held back so the malt leads.","icon":"hop","lvl":"style"}],"maltLine":"Colour and the coffee note come from roasted and caramel malt on a pale base. Caramel malt brings sweetness with the colour, roasted malt brings the dry edge — which of the two leads is the whole difference between a Czech dark lager and a stout.","stages":[{"id":"mash","name":"Mashing","what":"Starch becomes sugar","body":"Crushed malt meets hot water and the grain's own enzymes cut its starch into fermentable sugar. The result is <b>wort</b>: sweet, hopless, not yet beer.","params":[{"k":"Mashing","v":"Decoction.","lvl":"brewery"}],"note":null,"days":null},{"id":"boil","name":"Boil and hops","what":"Bitterness and aroma arrive","body":"The wort is boiled and hops go in. Early additions give bitterness, late ones give aroma. Nothing else in the process adds either.","params":[{"k":"Hops","v":"Saaz, held back so the malt leads.","lvl":"style"}],"note":"Hopped for balance rather than statement. The Saaz character shows in the aroma more than in the finish.","days":null},{"id":"ferment","name":"Fermentation","what":"Sugar becomes alcohol","body":"Cooled to about 6 °C and pitched with bottom-fermenting yeast. Sugar turns into alcohol and CO₂; cold and slow keeps the profile clean.","params":[{"k":"Fermentation","v":"Open vessels.","lvl":"brewery"}],"note":"Fermentation stopped comparatively early, near <b>74&nbsp;%</b>, and about <b>3.1°</b> stayed in the beer. That unfermented malt is what you feel as body, and it is why this tastes fuller than beers of the same strength.","days":[6,10]},{"id":"lager","name":"Lagering","what":"Time does the rest","body":"The green beer rests cold in horizontal tanks. It clears, softens, carbonates naturally and loses the harshness of young beer. This is the step industrial brewing cuts first.","params":[{"k":"Lagering temperature","v":"≈ 2 °C","lvl":"style"},{"k":"Lagering time","v":"several weeks","lvl":"style"}],"note":null,"days":[21,45]},{"id":"finish","name":"Finishing","what":"Clearing and packaging","body":"Filtration removes yeast and haze. Pasteurisation — heating the finished beer — is a separate decision, and plenty of Czech beer skips it.","params":[{"k":"Filtration","v":"Unfiltered.","lvl":"brewery"},{"k":"Pasteurisation","v":"Unpasteurised — filtered but never heated.","lvl":"brewery"}],"note":null,"days":null}],"timeline":{"brew":1,"ferment":8.0,"lager":33.0,"fermentLabel":"6–10 days","lagerLabel":"21–45 days","total":42,"lvl":"style"},"note":null,"hasBrewery":true,"allBrewery":false},"cs":{"attenuation":{"oe":12,"ae":3.1,"adf":74},"ingredients":[{"k":"Slad","v":"Světlý ječný slad s praženými a karamelovými slady pro barvu a kávový tón.","icon":"grain","lvl":"brewery"},{"k":"Chmel","v":"Žatecký chmel, držený vzadu, aby vedl slad.","icon":"hop","lvl":"style"}],"maltLine":"Barva a kávový tón pocházejí z pražených a karamelových sladů na světlém základu. Karamelový slad přináší sladkost s barvou, pražený suchou hranu — a který z nich vede, je celý rozdíl mezi českým tmavým ležákem a stoutem.","stages":[{"id":"mash","name":"Rmutování","what":"Ze škrobu vzniká cukr","body":"Šrotovaný slad se potká s horkou vodou a vlastní enzymy zrna rozštěpí jeho škro }},"anchor":false,"venues":3},{"id":"svijansky-maz","breweryId":"pivovar-svijany","name":"Svijanský Máz","cs":"Svijanský Máz 11°","style":"Czech pale lager","plato":11,"abv":4.8,"f":[4.5,6,5,4.5,1,2,1,3.5,1],"like":[],"lead":{"en":"The everyday Svijany, and the beer a Czech names when asked what they drink instead of the big three. Soft, malty, easy — brewed by a regional brewery small enough to feel local and large enough to be everywhere.","cs":"Každodenní Svijany, a pivo, které Čech jmenuje, když se ho zeptáte, co pije místo velké trojky. Měkké, sladové, snadné — z pivovaru dost malého na to, aby působil místně, a dost velkého na to, aby byl všude."},"notes":[],"prod":{"en":{"attenuation":{"oe":11,"ae":1.7,"adf":85},"ingredients":[{"k":"Water","v":"From the brewery's own wells.","icon":"drop","lvl":"brewery"},{"k":"Malt","v":"Floor-malted barley — <em>humnový slad</em> — bought from small independent maltings in Bohemia and Moravia. Floor malting is the slow traditional method, and it is where the bready, faintly honeyed base comes from.","icon":"grain","lvl":"brewery"},{"k":"Adjuncts","v":"A small amount of sugar in the boil. Not for sweetness — the yeast eats it almost entirely, so it raises alcohol while keeping the body light. It is why an 11° wort finishes at 4.8 % and still drinks easily.","icon":"sugar","lvl":"brewery"},{"k":"Hops","v":"Saaz from the brewery's own hop gardens in the Polepské blaty, plus hop extract for precise control of bitterness.","icon":"hop","lvl":"brewery"}],"maltLine":"A straightforward pale grist — Czech Pilsner malt doing all the work, which is the hardest kind of beer to hide anything in.","stages":[{"id":"mash","name":"Mashing","what":"Starch becomes sugar","body":"Crushed malt meets hot water and the grain's own enzymes cut its starch into fermentable sugar. The result is <b>wort</b>: sweet, hopless, not yet beer.","params":[{"k":"Mashing","v":"Double decoction.","lvl":"brewery"}],"note":null,"days":null},{"id":"boil","name":"Boil and hops","what":"Bitterness and aroma arrive","body":"The wort is boiled and hops go in. Early additions give bitterness, late ones give aroma. Nothing else in the process adds either.","params":[{"k":"Hops","v":"Saaz from the brewery's own hop gardens in the Polepské blaty, plus hop extract for precise control of bitterness.","lvl":"brewery"}],"note":"Hopped for balance rather than statement. The Saaz character shows in the aroma more than in the finish.","days":null},{"id":"ferment","name":"Fermentation","what":"Sugar becomes alcohol","body":"Cooled to about 6 °C and pitched with bottom-fermenting yeast. Sugar turns into alcohol and CO₂; cold and slow keeps the profile clean.","params":[{"k":"Fermentation","v":"Open fermentation vessels, up to about 12 °C, six to eight days.","lvl":"brewery"}],"note":"The yeast took it a long way down — about <b>85&nbsp;%</b> of the wort fermented out, leaving roughly <b>1.7°</b> in the glass. That is why it drinks lighter than its gravity suggests: the alcohol is there, the body is not.","days":[6,8]},{"id":"lager","name":"Lagering","what":"Time does the rest","body":"The green beer rests cold in horizontal tanks. It clears, softens, carbonates naturally and loses the harshness of young beer. This is the step industrial brewing cuts first.","params":[{"k":"Lagering temperature","v":"≈ 2 °C","lvl":"brewery"},{"k":"Lagering time","v":"30–60 days depending on the beer","lvl":"brewery"}],"note":null,"days":[30,60]},{"id":"finish","name":"Finishing","what":"Clearing and packaging","body":"Filtration removes yeast and haze. Pasteurisation — heating the finished beer — is a separate decision, and plenty of Czech beer skips it.","params":[{"k":"Filtration","v":"Kieselguhr filtration followed by microfiltration.","lvl":"brewery"},{"k":"Pasteurisation","v":"Unpasteurised — filtered but never heated.","lvl":"brewery"}],"note":null,"days":null}],"timeline":{"brew":1,"ferment":7.0,"lager":45.0,"fermentLabel":"6–8 days","lagerLabel":"30–6
