<title>Prague Beer Atlas</title>
<!-- Прототип в поиск не отдаём: 70 значений стоят на unverified, а бриф
     запрещает публиковать такие. Убрать эту строку, когда данные
     вычитаны — тогда же снимется и ограничение. -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  --card:#EAE1CC; --card-light:#F4EEDD; --foam:#FBF8EF;
  --ink:#17190F; --body:#35382A; --muted:#6F6B57;
  --line:#CFC5A9; --line-soft:#DCD2B6;
  --green:#1C3A29; --green-light:#7E9A88; --green-pale:#C4D2C8;
  --gold:#B8862B; --gold-bright:#D9A03C;
  --accent:#8A5E15; --dotted:#A89A72; --stale:#8E2318;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --card:#12160F; --card-light:#1B2117; --foam:#E8E2CE;
  --ink:#EFE7D0; --body:#D0C9B1; --muted:#8E8A72;
  --line:#2F3728; --line-soft:#333B2B;
  --green:#24422F; --green-light:#5F7E6B; --green-pale:#B6C7BB;
  --accent:#D9A03C; --dotted:#7A6C48; --stale:#D4796A;
}}
:root[data-theme="dark"]{
  --card:#12160F; --card-light:#1B2117; --foam:#E8E2CE;
  --ink:#EFE7D0; --body:#D0C9B1; --muted:#8E8A72;
  --line:#2F3728; --line-soft:#333B2B;
  --green:#24422F; --green-light:#5F7E6B; --green-pale:#B6C7BB;
  --accent:#D9A03C; --dotted:#7A6C48; --stale:#D4796A;
}

*{box-sizing:border-box}
body{margin:0;background:var(--card);color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}

/* ── enamel sign ── */
.sign{background:var(--green);border-bottom:5px solid var(--gold)}
.sign-in{max-width:1180px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.wordmark{font-weight:700;font-size:15px;letter-spacing:.19em;text-transform:uppercase;color:var(--foam)}
.nav{display:flex;gap:18px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.nav button{font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:var(--green-pale);font-weight:500}
.nav button:hover,.nav button[aria-current="page"]{color:var(--foam)}
.langsw{margin-left:auto;display:flex;border:1.5px solid var(--gold)}
.langsw button{font-size:12px;font-weight:700;letter-spacing:.1em;padding:6px 11px;color:var(--green-pale)}
.langsw button[aria-current]{background:var(--gold);color:#17190F}

.wrap{max-width:1180px;margin:0 auto;padding:0 26px 80px}

/* лист для домашней варки — врезка в боковой колонке */
.brewline{margin:26px 0 0;padding:15px 20px;background:var(--card-light);
  border-left:4px solid var(--gold);font-size:16.5px;max-width:64ch}
.brewline a{font-weight:600}

.brewsheet{display:block;background:var(--green);color:var(--foam);padding:18px 20px 20px;
  margin-bottom:22px;border-bottom:4px solid var(--gold);text-decoration:none}
.brewsheet:hover{background:#16301f}
.bs-eyebrow{display:block;font-size:10.5px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold-bright);margin-bottom:8px}
.brewsheet b{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:22px;
  line-height:1.12;display:block;margin-bottom:7px;color:var(--foam)}
.bs-sub{display:block;font-size:13.5px;line-height:1.45;color:var(--green-pale)}

/* ── beer page ── */
.crumb{font-size:12.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:38px 0 16px}
.crumb a{color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 176px;gap:40px;align-items:start}
h1{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:clamp(40px,6vw,66px);
  line-height:.98;letter-spacing:-.012em;margin:0 0 12px}
.rule{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.rule i{height:3px;width:46px;background:var(--gold);display:block}
.rule em{font-style:normal;font-size:14.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--green)}
.lead{font-size:19px;line-height:1.6;color:var(--body);max-width:56ch;margin:0}

.stamp{width:176px;height:176px;border-radius:50%;background:var(--green);
  box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 6px var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--foam)}
.stamp .fig{font-family:"Abril Fatface",Georgia,serif;font-size:52px;line-height:1}
.stamp .cap{font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-bright);margin-top:6px}
.stamp .hr{width:34px;height:1.5px;background:#4C6A57;margin:9px 0}
.stamp .alc{font-size:16px;font-weight:600}

/* label frame */
.frame{margin:40px 0 0;border:3px solid var(--green);padding:5px;background:var(--green)}
.frame-in{border:1px solid var(--green-light);background:var(--card-light);padding:26px 30px 28px}
.frame h2{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:27px;margin:0 0 3px}
.frame .sub{font-size:15.5px;color:var(--muted);margin:0 0 26px}

.axes{display:flex;flex-direction:column;gap:15px;max-width:830px}
.ax{display:grid;grid-template-columns:150px minmax(0,1fr) 170px;gap:20px;align-items:center}
.ax .name{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);text-align:right}
.ax .track{position:relative;height:22px}
.ax .track .base{position:absolute;top:10px;left:0;right:0;height:2px;background:var(--line-soft)}
.ax .track .a{position:absolute;top:5px;width:3px;height:12px;background:#8F8B72}
.ax .track .c{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;background:var(--gold);
  border:2px solid var(--ink);border-radius:50%}
.ax .word{font-size:16.5px;font-weight:600;color:var(--green)}
.legend{display:flex;gap:26px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line-soft);
  font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:8px}
.legend .k1{width:3px;height:12px;background:#8F8B72}
.legend .k2{width:12px;height:12px;background:var(--gold);border:2px solid var(--ink);border-radius:50%}

/* body columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 322px;gap:52px;padding:42px 0 0}
.cols h2{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:30px;margin:0 0 12px}
.cols h2+p{margin-top:0}
.cols section+section{margin-top:32px}
.cols p{font-size:18px;line-height:1.66;color:var(--body);margin:0 0 16px}

.where-h{display:flex;align-items:center;gap:16px;margin:34px 0 4px}
.where-h h2{margin:0}
.tally{display:inline-flex;gap:3px;align-items:flex-end;margin-bottom:4px}
.tally i{display:block;width:2.5px;height:17px;background:var(--accent);transform:skewX(-9deg)}
.tally i.five{width:19px;height:2.5px;transform:rotate(-26deg) translateY(-8px) translateX(-18px);margin-right:-18px}
.vlist{border-top:3px solid var(--green);margin-top:12px}
.v{display:grid;grid-template-columns:minmax(0,1fr) 190px 120px;gap:16px;padding:13px 0;
  border-bottom:1px solid var(--line);align-items:baseline}
.v .n{font-size:18.5px;font-weight:600}
.v .d{font-size:15px;color:var(--muted)}
.v .p{font-size:15px;font-weight:600}
h2.dist{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  font-family:"Archivo",system-ui,sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  margin:30px 0 0;padding-bottom:7px;border-bottom:2px solid var(--gold)}
h2.dist span{font-weight:500;letter-spacing:.06em;text-transform:none;font-size:13px}
.v .hint{display:block;font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:3px}
.v .hint b{color:var(--body)}
.v .h{font-size:13px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.miss{color:var(--muted);font-weight:400;border-bottom:1px dotted var(--dotted)}

/* čárka — лайк как отметка на подставке */
.coaster{border:2px solid var(--ink);background:var(--card-light);padding:18px 20px 20px;
  display:flex;flex-direction:column;gap:14px}
.coaster .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.coaster .ttl{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.coaster .cnt{font-family:"Abril Fatface",Georgia,serif;font-size:28px;line-height:1}

/* поле для палочек — как настоящий тácek */
.marks{min-height:46px;display:flex;align-items:flex-end;gap:5px;flex-wrap:wrap;
  border:1px dashed var(--line);padding:10px 12px;background:var(--card)}
.marks i{display:block;width:3px;height:26px;background:var(--accent);transform:skewX(-9deg)}
.marks i.five{width:28px;height:3px;transform:rotate(-26deg) translateY(-12px) translateX(-27px);margin-right:-27px}
.marks i.fresh{animation:draw .34s ease-out}
@keyframes draw{from{height:0;opacity:0}to{opacity:1}}
.marks .none{font-size:13.5px;color:var(--muted);font-style:italic;line-height:1.4}

/* приглашение — оно и объясняет, зачем нажимать */
.prompt{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:19px;
  line-height:1.25;margin:0;color:var(--ink)}
.prompt em{font-style:normal;color:var(--accent)}

/* клавиша: золото, борт снизу, настоящий ход при нажатии */
.carka{display:flex;align-items:center;gap:14px;width:100%;
  background:var(--gold);color:#17190F;border:2px solid var(--ink);
  box-shadow:0 5px 0 var(--ink);padding:13px 16px;transition:transform .06s,box-shadow .06s}
.carka:hover{background:var(--gold-bright)}
.carka:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.carka .lab{display:flex;flex-direction:column;gap:1px;text-align:left}
.carka .lab b{font-size:16.5px;font-weight:700;letter-spacing:.01em}
.carka .lab span{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.carka .glass{flex-shrink:0}
.carka .beer{transition:transform .3s ease-out;transform-origin:bottom}

/* отрицание — тихой ссылкой, а не второй кнопкой */
.notme{align-self:flex-start;font-size:13.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:1px}
.notme:hover{color:var(--ink)}
.notme[aria-pressed="true"]{color:var(--stale);border-bottom-color:var(--stale)}
.coaster .hint{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.marks i.fresh{animation:none}.carka .beer{transition:none}}

/* how it is made — варочный цех */
.att{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--ink);
  border:2px solid var(--ink);margin:20px 0 30px}
.att div{background:var(--card-light);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.att b{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:30px;line-height:1}
.att span{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.att em{font-style:normal;font-size:13px;color:var(--muted)}

/* шкала времени: неделя брожения против полутора месяцев лежания */
.tl-wrap{border:2px solid var(--ink);background:var(--card-light);padding:18px 20px 20px;margin:0 0 34px}
.tl-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.tl-head .t{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tl-head .tot{font-family:"Abril Fatface",Georgia,serif;font-size:22px}
.tl-bar{display:flex;height:26px;border:1.5px solid var(--ink);overflow:hidden}
.tl-bar span{display:block;height:100%}
.tl-bar .b0{background:var(--gold)}
.tl-bar .b1{background:var(--green-light)}
.tl-bar .b2{background:var(--green)}
.tl-key{display:flex;gap:22px;margin-top:11px;flex-wrap:wrap;font-size:13px;color:var(--body)}
.tl-key span{display:flex;align-items:center;gap:7px}
.tl-key i{width:13px;height:13px;display:block;border:1px solid var(--ink)}

/* что кладут */
.ing{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2px;
  background:var(--line);border:2px solid var(--ink);margin:14px 0 34px}
.ing-c{background:var(--card-light);padding:18px 20px;display:flex;gap:16px;align-items:flex-start}
.ing-c svg{flex-shrink:0;margin-top:1px}
.ing-c .txt{min-width:0}
.ing-c .k{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.ing-c .val{font-size:15.5px;line-height:1.55;color:var(--body)}
.ing-c .val em{font-style:italic;color:var(--ink)}

/* этапы */
.stages{position:relative;margin:14px 0 26px}
.stages::before{content:"";position:absolute;left:33px;top:30px;bottom:30px;width:2px;
  background:var(--line);z-index:0}
.stg{position:relative;display:grid;grid-template-columns:68px minmax(0,1fr);gap:24px;
  padding:0 0 26px;z-index:1}
.stg .ves{width:68px;height:68px;background:var(--card-light);border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center}
.stg h3{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:22px;margin:0 0 2px;line-height:1.15}
.stg .what{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin:0 0 9px}
.stg .body{font-size:16px;line-height:1.6;color:var(--muted);margin:0 0 12px;max-width:62ch}
.stg .note{font-size:16.5px;line-height:1.6;color:var(--body);margin:0 0 12px;max-width:62ch}
.stg .prm{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.prm-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:start}
.prm-k{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.prm-v{font-size:15.5px;line-height:1.55;color:var(--body)}
.prm-v em{font-style:italic;color:var(--ink)}
.stg .dur{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--green);border:1.5px solid var(--green);padding:2px 8px;margin-left:10px;
  vertical-align:3px}
.lvl{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid currentColor;padding:1px 5px;vertical-align:1px;margin-left:6px}
.lvl.b{color:var(--green)}
.lvl.s{color:var(--muted)}
.conf{font-size:14.5px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.decl{font-size:15px;line-height:1.6;color:var(--muted);margin:0 0 2px;max-width:74ch}


/* ── распознавание бутылки ── */
.scan-in{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 8px}
.scan-in input{font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--ink);
  background:var(--card-light);color:var(--ink);width:220px;letter-spacing:.06em}
.btn-go{border:2px solid var(--ink);background:var(--gold);color:#17190F;padding:13px 20px;
  font-size:14px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
.btn-alt{border:2px solid var(--ink);padding:13px 20px;font-size:14px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;background:var(--card-light)}
#cam{display:block;width:100%;max-width:420px;border:2px solid var(--ink);background:#000;margin-top:14px}
#cam[hidden]{display:none}   /* иначе display:block перебивает атрибут hidden */
.rungs{border:2px solid var(--ink);background:var(--card-light);margin:26px 0 0}
.rung{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--line);align-items:start}
.rung:last-child{border-bottom:0}
.rung i{font-style:normal;width:26px;height:26px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.rung.hit i{border-color:var(--green);background:var(--green);color:var(--foam)}
.rung.hit b{color:var(--ink)}
.rung.skip{opacity:.45}
.rung b{display:block;font-size:15.5px;color:var(--muted)}
.rung span{display:block;font-size:14px;line-height:1.5;color:var(--muted);margin-top:2px}
.answer{border:3px solid var(--green);padding:5px;background:var(--green);margin-top:24px}
.answer-in{border:1px solid var(--green-light);background:var(--card-light);padding:22px 24px}
.answer h3{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:26px;margin:0 0 6px}
.answer p{font-size:16px;line-height:1.6;color:var(--body);margin:0 0 14px;max-width:60ch}
.bottles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px;
  background:var(--line);border:2px solid var(--ink);margin-top:16px}
.bottle{background:var(--card-light);padding:14px 16px;display:block;text-align:left}
.bottle .n{display:block;font-size:16px;font-weight:600;color:var(--ink)}
.bottle .m{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
@media (max-width:620px){.scan-in input{width:100%}}

/* sidebar */
.panel{border:2px solid var(--ink);background:var(--card-light)}
.panel .head{background:var(--ink);color:var(--card);padding:9px 16px;
  font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.panel .in{padding:16px 18px 18px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.kv:last-of-type{border-bottom:0}
.kv span:first-child{font-size:15.5px;color:var(--body)}
.kv b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.panel .foot{margin-top:13px;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:13px;line-height:1.5;color:var(--muted)}
.side-h{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--gold)}
.sidebar{display:flex;flex-direction:column;gap:26px}
.like{display:flex;flex-direction:column;gap:14px}
.like button{display:block;width:100%}
.like .n{font-size:16.5px;font-weight:600}
.like .w{font-size:14.5px;color:var(--body);display:block}
.like .w2{font-size:13px;color:var(--muted);display:block;margin-top:1px}
.like button{padding:2px 0}
.promo{background:var(--green);color:var(--foam);padding:20px 20px 18px;border-bottom:5px solid var(--gold)}
.promo p{font-size:17px;line-height:1.5;margin:0 0 14px;color:var(--foam)}
.promo b{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-bright)}

/* finder */
.finder{display:grid;grid-template-columns:360px minmax(0,1fr);gap:2px;background:var(--line);border:2px solid var(--ink);margin-top:24px}
.fcol{background:var(--card-light);padding:24px 26px}
.step{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin:0 0 13px;padding-bottom:8px;border-bottom:2px solid var(--gold)}
.step.next{margin-top:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border:2px solid var(--line);font-size:14.5px;font-weight:600;color:var(--body)}
.chip:hover{border-color:var(--muted)}

<script>
const DATA = /*__DATA__*/null;
const UI_CS = /*__UI_CS__*/null;
const AXNAME_CS = {"Bitterness": "Hořkost", "Malt sweetness": "Sladová sladkost", "Body": "Plnost", "Dry finish": "Suchý závěr", "Roast": "Praženost", "Fruit": "Ovocnost", "Tartness": "Kyselost", "Hop aroma": "Chmelové aroma", "Hop character": "Charakter chmele"};
const POLE_CS = {"bitterness": ["měkčí", "hořčejší"], "maltSweetness": ["méně sladové", "sladší"], "body": ["lehčí", "plnější"], "dryness": ["kulatější", "sušší závěr"], "roast": ["méně pražené", "káva, karamel"], "fruitEster": ["čistší", "ovocnější"], "sourness": ["méně kyselé", "kyselejší"], "hopAroma": ["tišší aroma", "výraznější chmelové aroma"], "hopProfile": ["žatecký, bylinný", "citrus, tropy"]};
let LANG = (() => {
  const m = (location.hash || "").match(/^#\/(en|cs)\b/);
  if (m) return m[1];
  try { return localStorage.getItem("pba.lang") || "en"; } catch (e) { return "en"; }
})();
const STYLE_CS = {"Czech pale lager": "světlý ležák", "Czech pale lager, unfiltered": "světlý ležák, nefiltrovaný", "Czech dark lager": "tmavý ležák", "Czech amber lager": "polotmavý ležák", "Czech pale special": "světlý speciál", "American IPA": "americká IPA", "American pale ale": "americký pale ale", "Irish dry stout": "irský suchý stout", "Euro pale lager": "evropský světlý ležák", "Pale lager": "světlý ležák", "Witbier": "belgické bílé", "German wheat beer": "německé pšeničné"};
function ST(s){ return LANG==="cs" && STYLE_CS[s] ? STYLE_CS[s] : s; }
function T(s){ return LANG === "cs" && UI_CS[s] ? UI_CS[s] : s; }

/* Чешский различает три формы числа: 1 den, 2–4 dny, 5+ dní. Английскому
   хватает двух. Для диапазона форму задаёт последнее число: «6–10 dní». */
function num(n, en1, en2, cs1, cs2, cs5){
  const k = Math.abs(Number(n)) % 100;
  if (LANG !== "cs") return n === 1 ? en1 : en2;
  return k === 1 ? cs1 : (k >= 2 && k <= 4 ? cs2 : cs5);
}
const daysWord = n => num(n, "day", "days", "den", "dny", "dní");

/* Часы в OpenStreetMap записаны машинным синтаксисом: "Mo-We 11:00-23:30;
   Su 12:00-22:00". Раньше строка резалась по 22 символам и превращалась в
   мусор — «Mo-We 11:00-23:30; Su». Разбираем то, что разбирается уверенно,
   и отвечаем на вопрос, который человек на самом деле задаёт: открыто ли
   сегодня. Всё, в чём не уверены, показываем как есть — не притворяемся,
   что поняли. */
const OSM_DAY = { Su:0, Mo:1, Tu:2, We:3, Th:4, Fr:5, Sa:6 };

function hoursToday(spec){
  if (!spec) return null;
  const s = String(spec).trim();
  if (s === "24/7") return T("open around the clock");
  /* сезонные и астрономические правила не трогаем: Apr-Oct, sunset, week 1-52 */
  if (/\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|sunset|sunrise|dawn|dusk|week|easter)\b/i.test(s)) return null;

  const rules = s.split(";")
    .reduce((acc, part) => acc.concat(part.split(/(?<=\d)\s*,\s*(?=[A-Za-z])/)), [])
    .map(x => x.trim()).filter(Boolean);

  const today = new Date().getDay();
  let hit = null;                       /* последнее правило про сегодня побеждает */
  const selRe = /^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:\s*-\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))?|PH)(?:\s*,\s*(?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:\s*-\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))?|PH))*)\s+(.+)$/;

  for (const rule of rules) {
    let days = null, rest = rule;
    const m = rule.match(selRe);
    if (m) { days = m[1]; rest = m[2].trim(); }

    let set;
    if (days === null) {
      set = [0,1,2,3,4,5,6];           /* без селектора — правило на всю неделю */
    } else {
      set = [];
      for (const tok of days.split(",").map(x => x.trim())) {
        if (tok === "PH") continue;    /* праздники не выдумываем */
        const r = tok.split("-").map(x => x.trim());
        if (r.length === 1) { set.push(OSM_DAY[r[0]]); continue; }
        let a = OSM_DAY[r[0]], b = OSM_DAY[r[1]];
        if (a === undefined || b === undefined) return null;
        for (let i = a; ; i = (i + 1) % 7) { set.push(i); if (i === b) break; }
      }
      if (!set.length) continue;       /* правило было только про PH */
    }
    if (!set.includes(today)) continue;

    if (/^(?:off|closed)$/i.test(rest)) { hit = { closed: true }; continue; }

    const open = rest.match(/^(\d{1,2})\s*:\s*(\d{2})\s*\+$/);
    if (open) { hit = { from: open[1].padStart(2,"0") + ":" + open[2] }; continue; }

    const spans = rest.split(",").map(x => x.trim());
    const out = [];
    for (const sp of spans) {
      const t = sp.match(/^(\d{1,2})\s*:\s*(\d{2})\s*-\s*(\d{1,2})\s*:\s*(\d{2})$/);
      if (!t) return null;             /* синтаксис не наш — отдаём строку как есть */
      out.push(t[1].padStart(2,"0") + ":" + t[2] + "–" + t[3].padStart(2,"0") + ":" + t[4]);
    }
    hit = { spans: out };
  }

  if (!hit) return T("closed today");
  if (hit.closed) return T("closed today");
  if (hit.from) return T("today from %s").replace("%s", hit.from);
  return T("today %s").replace("%s", hit.spans.join(", "));
}

/* короткая строка для списка: разобранное «сегодня», иначе исходный текст */
function hoursCell(spec){
  if (!spec) return '<span class="h">' + T("hours unknown") + '</span>';
  const t = hoursToday(spec);
  return '<span class="h"' + (t ? ' title="' + esc(spec) + '"' : '') + '>' +
         (t ? esc(t) : esc(spec)) + '</span>';
}
function L(o){ return (o && (o[LANG] || o.en)) || ""; }
function setLang(l){
  LANG = l;
  try { localStorage.setItem("pba.lang", l); } catch (e) {}
  const rest = (location.hash || "#/home").replace(/^#\/(en|cs)\b/, "#");
  location.hash = "/" + l + (rest.startsWith("#/") ? rest.slice(1) : "/home");
  route();
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const AX = ["bitterness","maltSweetness","body","dryness","roast","fruitEster","sourness","hopAroma","hopProfile"];
const AXNAME_EN = {bitterness:"Bitterness",maltSweetness:"Malt sweetness",body:"Body",dryness:"Dry finish",
  roast:"Roast",fruitEster:"Fruit",sourness:"Tartness",hopAroma:"Hop aroma",hopProfile:"Hop character"};
const POLE_EN = {
  bitterness:["softer","more bitter"], maltSweetness:["drier malt","sweeter"],
  body:["lighter","fuller"], dryness:["rounder","drier finish"],
  roast:["less roast","coffee, caramel"], fruitEster:["cleaner","fruitier"],
  sourness:["less tart","tarter"], hopAroma:["quieter aroma","bigger hop aroma"],
  hopProfile:["Saaz, herbal","citrus, tropical"]
};

function host(u){ try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } }
const beerById = Object.fromEntries(DATA.beers.map(b => [b.id, b]));
const brById = Object.fromEntries(DATA.breweries.map(b => [b.id, b]));
const pourable = DATA.beers.filter(b => !b.anchor && b.venues > 0);
/* Городские части идут своим порядком, а не алфавитным: Praha 2 перед
   Praha 10, именные части (Praha-Kunratice) после нумерованных, без района —
   в конец. Иначе десятка встаёт между единицей и двойкой. */
function districtRank(d){
  if (!d) return [3, 0, ""];
  const m = String(d).match(/^Praha\s+(\d{1,2})$/i);
  if (m) return [0, parseInt(m[1], 10), ""];
  if (/^Praha[\s-]/i.test(d)) return [1, 0, d];
  return [2, 0, d];
}
function byDistrict(a, b){
  const x = districtRank(a.d), y = districtRank(b.d);
  return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2]) || a.n.localeCompare(b.n);
}
const venuesFor = bid => DATA.venues.filter(v => v.b.indexOf(bid) >= 0).sort(byDistrict);

/* ── shared bits ─────────────────────────────────────────────────────── */
function tally(n){
  let h = '<span class="tally" aria-hidden="true">';
  for (let i = 0; i < Math.min(n, 20); i++) h += '<i' + ((i + 1) % 5 === 0 ? ' class="five"' : "") + "></i>";
  return h + "</span>" + (n > 20 ? ' <span style="color:var(--muted);font-size:14px">' + n + "</span>" : "");
}

const NOUNY = new Set(["coffee, caramel", "Saaz, herbal", "citrus, tropical",
  "káva, karamel", "žatecký, bylinný", "citrus, tropy"]);
function deltaWord(ax, d, strong){
  const w = POLE[ax][d > 0 ? 1 : 0];
  if (Math.abs(d) < (strong || 4) || NOUNY.has(w)) return w;
  return (w.startsWith("more ") || w.startsWith("less ") ? (LANG==="cs"?"mnohem ":"much ") : (LANG==="cs"?"mnohem ":"far more ")) + w;
}
function explain(a, c){
  const diffs = AX.map((ax,i)=>({ax,d:c.f[i]-a.f[i]})).filter(x=>Math.abs(x.d)>=1.5)
    .sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,3);
  if(!diffs.length) return (LANG==="cs"?"velmi blízko ":"very close to ")+"<b>"+esc(a.name)+"</b>";
  return (LANG==="cs"?"jako <b>":"like <b>")+esc(a.name)+"</b>"+(LANG==="cs"?", ale ":", but ")+diffs.map(x=>deltaWord(x.ax,x.d)).join(", ");
}
function nearest(b, n){
  return pourable.filter(x=>x.id!==b.id).map(x=>{
    let s=0; for(let i=0;i<AX.length;i++){const d=b.f[i]-x.f[i]; s+=d*d;}
    return {x, d:Math.sqrt(s)};
  }).sort((p,q)=>p.d-q.d).slice(0,n);
}


/* ── варочный цех: посуда, поток, время ──────────────────────────────── */

/* ── знак сорта: бокал в настоящем цвете пива ─────────────────────────
   EBC ни у одного сорта в данных нет, поэтому цвет берётся из типичного
   диапазона стиля. Это уровень «style», и в интерфейсе он помечен так же,
   как оценки вкуса. Стиля нет — бокала нет: пустое стекло не рисуем. */
const EBC_BY_STYLE = {
  "Czech pale lager": 8, "Czech pale lager, unfiltered": 9, "Czech pale special": 11,
  "Czech amber lager": 26, "Czech dark lager": 70, "Euro pale lager": 7, "Pale lager": 7,
  "American IPA": 18, "American pale ale": 14, "Irish dry stout": 125,
  "Witbier": 6, "German wheat beer": 12,
};
const SRM_HEX = ["#FFE699","#FFD878","#FFCA5A","#FFBF42","#FBB123","#F8A733","#F39C00",
"#EA8F00","#E58500","#DE7C00","#D77200","#CF6900","#CB6200","#C35900","#BB5100","#B54C00",
"#B04500","#A63E00","#A13700","#9B3200","#952D00","#8E2900","#882300","#821E00","#7B1A00",
"#771900","#701400","#6A0E00","#660D00","#5E0B00","#5A0A02","#600903","#520907","#4C0505",
"#470606","#440607","#3F0708","#3B0607","#3A070B","#36080A"];

function beerColour(style){
  const e = EBC_BY_STYLE[style];
  if (!e) return null;
  return SRM_HEX[Math.max(1, Math.min(40, Math.round(e / 1.97))) - 1];
}

/* w — ширина в пикселях. etch=true вытравливает градус на стекле; в списке
   он не нужен, там степень и так стоит строкой под названием. */
function glassSvg(b, w, etch){
  const c = beerColour(b.style);
  if (!c) return "";
  const id = "g" + b.id.replace(/[^a-z0-9]/gi, ""), h = Math.round(w * 1.42);
  const hazy = /unfiltered/.test(b.style) || b.style === "Witbier" || b.style === "German wheat beer";
  const dark = (EBC_BY_STYLE[b.style] || 0) > 40;
  const ef = dark ? "#FBF8EF" : "var(--ink)", eo = dark ? ".66" : ".44";
  const et = (etch && b.plato)
    ? `<text x="50" y="96" text-anchor="middle" class="etch-n" fill="${ef}" opacity="${eo}">${b.plato}°</text>` : "";
  const haze = hazy
    ? `<circle cx="42" cy="72" r="15" fill="#fff" opacity=".14"/><circle cx="64" cy="98" r="11" fill="#fff" opacity=".11"/>` : "";
  const body = "M22 16h56l-5 108a8 8 0 0 1-8 7.5H35a8 8 0 0 1-8-7.5z";
  return `<svg class="glass" viewBox="0 0 100 142" width="${w}" height="${h}" role="img"
    aria-label="${esc(b.name)}"><defs><clipPath id="c${id}"><path d="${body}"/></clipPath>
    <linearGradient id="l${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".84"/>
    <stop offset="1" stop-color="${c}" stop-opacity="1"/></linearGradient></defs>
    <g clip-path="url(#c${id})"><rect x="0" y="36" width="100" height="106" fill="url(#l${id})"/>
    <rect x="0" y="14" width="100" height="22" fill="var(--foam)"/>
    <path d="M18 36q7 6 14 0t14 0 14 0 14 0 14 0v7H18z" fill="var(--foam)"/>${haze}
    <rect x="28" y="36" width="7" height="106" fill="#fff" opacity=".17"/></g>
    <path d="${body}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>${et}</svg>`;
}

function lvlTag(l){ return '<span class="lvl ' + (l === "brewery" ? "b" : "s") + '">' + T(l === "brewery" ? "brewery" : "style") + "</span>"; }

function brewhouse(pr, beerId){
  const a = pr.attenuation, tl = pr.timeline;

  /* метка полезна, только пока она про меньшинство: если все строки одного
     уровня, значок на каждой ничего не сообщает. Считаем по всей секции,
     большинство объявляем строкой под заголовком, помечаем только остаток. */
  const lv = [tl.lvl].concat(pr.ingredients.map(x => x.lvl),
    pr.stages.reduce((acc, st) => acc.concat(st.params.map(x => x.lvl)), []));
  const nB = lv.filter(l => l === "brewery").length, nS = lv.length - nB;
  const major = nB >= nS ? "brewery" : "style";
  const tag = l => l === major ? "" : lvlTag(l);
  const decl = (nB && nS)
    ? (major === "brewery"
        ? T("Unless marked %s, everything below is known for this brewery.")
            .replace("%s", lvlTag("style"))
        : T("Unless marked %s, everything below is what beers of this style normally do, and is not confirmed for this beer.")
            .replace("%s", lvlTag("brewery")))
    : (nB ? T("Everything below is known for this brewery.")
          : T("Nothing below is confirmed for this beer — it is what beers of this style normally do."));
  const tot = tl.brew + tl.ferment + tl.lager;
  const pc = n => (n / tot * 100).toFixed(1) + "%";

  const stats = a ? `<div class="att">
    <div><b>${a.oe}°</b><span>${T("Wort gravity")}</span><em>${T("before fermentation")}</em></div>
    <div><b>${a.ae}°</b><span>${T("Left in the glass")}</span><em>${T("residual extract")}</em></div>
    <div><b>${a.adf} %</b><span>${T("Fermented out")}</span><em>${T("apparent attenuation")}</em></div>
  </div>` : "";

  const timeline = `<div class="tl-wrap">
    <div class="tl-head"><span class="t">${T("Grain to glass")} ${tag(tl.lvl)}</span>
      <span class="tot">≈ ${tl.total} ${daysWord(tl.total)}</span></div>
    <div class="tl-bar">
      <span class="b0" style="width:${pc(tl.brew)}"></span>
      <span class="b1" style="width:${pc(tl.ferment)}"></span>
      <span class="b2" style="width:${pc(tl.lager)}"></span>
    </div>
    <div class="tl-key">
      <span><i style="background:var(--gold)"></i>${T("Brew day — one shift")}</span>
      <span><i style="background:var(--green-light)"></i>${LANG==="cs"?"Kvašení":"Fermentation"} — ${tl.fermentLabel}</span>
      <span><i style="background:var(--green)"></i>${LANG==="cs"?"Ležení":"Lagering"} — ${tl.lagerLabel}</span>
    </div>
  </div>`;

  const ing = pr.ingredients.length ? `<div class="ing">${pr.ingredients.map(x=>`
    <div class="ing-c">${ICON[x.icon] || ""}<div class="txt">
      <div class="k">${esc(x.k)}${tag(x.lvl)}</div><div class="val">${x.v}</div></div></div>`).join("")}
  </div>` : "";

  const stages = `<div class="stages">${pr.stages.map(s=>`
    <div class="stg">
      <div class="ves">${VESSEL[s.id] || ""}</div>
      <div>
        <h3>${esc(s.name)}${s.days ? `<span class="dur">${s.days[0]===s.days[1] ? s.days[0] : s.days[0]+"–"+s.days[1]} ${daysWord(s.days[1])}</span>` : ""}</h3>
        <p class="what">${esc(s.what)}</p>
        <p class="body">${s.body}</p>
        ${s.note ? `<p class="note">${s.note}</p>` : ""}
        ${s.params.length ? `<div class="prm">${s.params.map(p=>`
          <div class="prm-row"><div class="prm-k">${esc(p.k)}${tag(p.lvl)}</div>
          <div class="prm-v">${p.v}</div></div>`).join("")}</div>` : ""}
      </div>
    </div>`).join("")}</div>`;

  return `<section style="margin-top:36px">
    <h2>${T("How it is made")}</h2>
    <p class="decl">${decl}</p>
    ${stats}
    ${timeline}
    <h3 style="font-family:'Abril Fatface',Georgia,serif;font-weight:400;font-size:24px;margin:0 0 4px">${T("What goes in")}</h3>
    <p style="font-size:16px;color:var(--muted);margin:0 0 4px;max-width:62ch">${pr.maltLine}</p>
    ${ing}
    <h3 style="font-family:'Abril Fatface',Georgia,serif;font-weight:400;font-size:24px;margin:0 0 14px">${T("Then, in order")}</h3>
    ${stages}
    ${pr.note ? `<p style="font-size:16.5px;line-height:1.6;color:var(--body);max-width:64ch">${pr.note}</p>` : ""}
    ${BREW_SHEETS[beerId] ? `
    <p class="brewline"><a href="${BREW_SHEETS[beerId]}" target="_blank" rel="noopener">${
      T("Want to brew this yourself? Here is the recipe, the ingredients and what they cost →")}</a></p>` : ""}
    <p class="conf">${T("The three figures at the top are computed from this beer's own gravity and strength. Where we do not know what a brewery does, we say what the style normally does rather than invent a mash schedule.")}
      <a href="#/${LANG}/brewing">${T("How Czech lager is made →")}</a></p>
  </section>`;
}

  const axesHtml = diffs.map(({ax,i,d})=>`

const AXNAME = new Proxy({}, {get:(_,k)=>LANG==="cs"?(AXNAME_CS[AXNAME_EN[k]]||AXNAME_EN[k]):AXNAME_EN[k]});
const POLE = new Proxy({}, {get:(_,k)=>LANG==="cs"?(POLE_CS[k]||POLE_EN[k]):POLE_EN[k]});
const SLIDER_AX = ["bitterness","maltSweetness","body","roast","hopProfile"];
const ANCHOR_IDS = ["pilsner-urquell","kozel-cerny","budweiser-budvar-original",
  "guinness-draught","corona-extra","brewdog-punk-ipa","hoegaarden","matuska-raptor"];
let anchorId = "pilsner-urquell", deltas = {};

function finderPage(){
  $("#view").innerHTML = `
    <p class="crumb">${T("Find your beer")}</p>
    <h1 style="font-size:44px;margin-bottom:8px">${T("Start from a beer you know")}</h1>

    <div class="finder">
      <div class="fcol">
        <p class="step">${T("1 · A beer you know")}</p>
        <div class="chips" id="anchors"></div>
        <p class="step next">${T("2 · But make it")}</p>
        <div id="sliders"></div>
        <button class="reset" id="reset">${T("Reset all")}</button>
      </div>
      <div class="fcol">
        <p class="step" id="resHead">${T("Closest, and where to drink it")}</p>
        <div id="results"></div>
      </div>
    </div>
    <p class="note"><b>${T("Weighting is deliberate.")}</b> ${T("Axes you actually moved count for more than the\n      ones you left alone — asking for less bitterness makes a bitterness miss cost more. The match\n      is plain arithmetic, not a model: same input, same answer, every time, and it cannot invent\n      a taste claim.")}</p>`;

  $("#anchors").innerHTML = ANCHOR_IDS.filter(i=>beerById[i]).map(i=>
    `<button class="chip" data-anchor="${i}" aria-pressed="${i===anchorId}">${esc(beerById[i].name)}</button>`).join("");
  $("#sliders").innerHTML = SLIDER_AX.map(ax=>{ const label = AXNAME[ax]; return `
    <div class="sl">
      <div class="lab"><b>${label}</b><i id="v-${ax}">${deltas[ax] ? esc(deltaWord(ax,deltas[ax],3)) : (LANG==="cs"?"beze změny":"unchanged")}</i></div>
      <input type="range" min="-4" max="4" step="1" value="${deltas[ax]||0}" data-ax="${ax}" aria-label="${label}">
      <div class="poles"><span>${POLE[ax][0]}</span><span>${POLE[ax][1]}</span></div>
    </div>`; }).join("");
  runMatch();
}

function runMatch(){
  const a = beerById[anchorId];
  const target = a.f.map((v,i)=>Math.max(0,Math.min(10, v + (deltas[AX[i]]||0))));
  const scored = pourable.filter(b=>b.id!==anchorId).map(b=>{
    let s=0;
    for(let i=0;i<AX.length;i++){
      const w = 1 + Math.abs(deltas[AX[i]]||0)*0.6;
      const d = target[i]-b.f[i];
      s += w*d*d;
    }
    return {b, dist:Math.sqrt(s)};
  }).sort((x,y)=>x.dist-y.dist).slice(0,6);

  const moved = AX.filter(ax=>deltas[ax]).map(ax=>deltaWord(ax,deltas[ax],3));
  $("#resHead").textContent = moved.length ? a.name+" — "+moved.join(", ")
    : (LANG==="cs" ? "Nejblíž k "+a.name+", a kde to vypít"
                   : "Closest to "+a.name+", and where to drink it");

  $("#results").innerHTML = scored.map(({b})=>{
    const vs = venuesFor(b.breweryId).slice(0,3);
    return `<button class="res" data-go="#/beer/${b.id}">
      <span class="res-h"><h3>${esc(b.name)}</h3><span class="cs">${esc(b.cs)}</span></span>
      <span class="exp">${explain(a,b)}</span>
      <span class="meta">${b.plato ? b.plato+"° · " : ""}${b.abv ? b.abv+" % · " : ""}${esc(ST(b.style))}
        — ${LANG==="cs"?"čepují:":"poured at"} ${vs.map(v=>esc(v.n)).join(", ")}${b.venues>3 ? " " + T("and %s more").replace("%s", b.venues-3) : ""}</span>
    </button>`;
  }).join("");
}

/* ── распознавание бутылки ──────────────────────────────────────────────
   Первая ступень настоящая: штрихкод читает сам браузер через
   BarcodeDetector, локально. Ни зрительной модели, ни сервера, ни платы.
   Вторая ступень — чтение этикетки — в прототипе не построена, для неё
   нужен бэкенд, и страница об этом прямо говорит.                      */

const RUNGS = [
  ["barcode", "Barcode", "Read by the phone itself. Exact when it hits."],
  ["label",   "Label",   "The name on the front. You can type it; having the camera read it needs a server."],
  ["brewery", "Brewery", "Beer unknown, brewery known. Enough to say where it is poured."],
  ["anchor",  "Anchor",  "Nothing known. We take what the label says into the finder."]
];

function rungList(hit){
  const order = ["barcode", "label", "brewery", "anchor"];
  const at = order.indexOf(hit);
  return `<div class="rungs">${RUNGS.map(([id, name, why], i) => {
    const cls = id === hit ? "rung hit" : (i < at ? "rung" : "rung skip");
    return `<div class="${cls}"><i>${i + 1}</i><div>
      <b>${T(name)}</b><span>${T(why)}</span></div></div>`;
  }).join("")}</div>`;
}

/* Три входа — штрихкод, чтение этикетки и набор руками — сходятся сюда.
   Разница принципиальная и её видно на экране: штрихкод даёт ОТВЕТ, а
   название с этикетки даёт КАНДИДАТОВ, потому что это всегда догадка. */
function renderAnswer(r, hit){
  const el = $("#scan-out");
  const br = r.brewery ? brById[r.brewery] : null;
  let body = "";
  if (r.kind === "beer") {
    const b = beerById[r.id] || {};
    body = `<h3>${esc(b.name || r.label)}</h3>
      <p>${T("Matched. There is a full page: how it is made, how it differs from a beer you know, and where to drink it.")}</p>
      <button class="btn-go" data-go="#/beer/${r.id}">${T("Open the beer")}</button>`;
  } else if (r.kind === "listed") {
    const l = listedById[r.id] || {};
    body = `<h3>${esc(l.name || r.label)}</h3>
      <p>${T("Matched a catalogue line. We know the numbers, the brewery and where to drink it. We have not tasted it, so there is no description.")}</p>
      <button class="btn-go" data-go="#/listed/${r.id}">${T("Open the line")}</button>`;
  } else if (r.kind === "brewery") {
    body = `<h3>${esc(br ? br.name : r.brand)}</h3>
      <p>${T("This exact beer is not in the atlas. The brewery is, and that answers the question you actually asked: where it is poured in Prague.")}</p>
      <button class="btn-go" data-go="#/brewery/${r.id}">${T("Where the brewery is poured")}</button>`;
  } else if (r.kind === "hint") {
    body = `<h3>${esc(r.label)}</h3>
      <p>${T("We have not confirmed this as a brewery — it is a name on a tap, and nothing more. But we know who puts it there, and that is still an answer:")}
        <b>${esc((r.venues || []).join(", "))}</b>.</p>
      <button class="btn-alt" data-go="#/breweries">${T("Marks we have not confirmed")}</button>`;
  } else {
    const read = [r.label, r.brand, r.abv ? r.abv + " %" : null, r.plato ? r.plato + "°" : null]
      .filter(Boolean).join(" · ");
    body = `<h3>${T("Not in the atlas")}</h3>
      <p>${T("Here is everything the barcode gave us:")} <b>${esc(read)}</b>.
        ${T("No Prague venue in our data pours it. Rather than invent a page, we hand you to the finder with what we read.")}</p>
      <button class="btn-alt" data-go="#/find">${T("Find your beer")}</button>`;
  }
  el.innerHTML = rungList(hit) + `<div class="answer"><div class="answer-in">${body}</div></div>`;
  el.scrollIntoView({block: "nearest"});
}

function scanAnswer(ean){
  const r = (DATA.scan || {})[ean];
  if (!r) {
    $("#scan-out").innerHTML = `<div class="answer"><div class="answer-in">
      <h3>${T("Not a barcode we know")}</h3>

/* Набор с этикетки. Работает для ЛЮБОЙ бутылки, включая те, у которых нет
   ни штрихкода в нашей таблице, ни фотографии: человек и так читает
   название глазами, здесь он просто набирает три буквы. Ноль вызовов
   наружу — ищем по тому, что уже лежит в странице. */
const fold = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

let LABEL_IDX = null;
function labelIndex(){
  if (LABEL_IDX) return LABEL_IDX;
  const idx = [];
  const add = (kind, id, name, extra, brewery, venues) => {
    if (name) idx.push({kind, id, label: name, brand: extra || "", brewery, venues,
                        k: fold(name + " " + (extra || ""))});
  };
  (DATA.beers || []).filter(b => !b.anchor)
    .forEach(b => add("beer", b.id, b.name, [b.cs, b.style].filter(Boolean).join(" "), b.breweryId));
  (DATA.listed || []).forEach(b => add("listed", b.id, b.name, b.cs, b.breweryId));
  (DATA.breweries || []).forEach(b => add("brewery", b.id, b.name, b.nameEn || "", b.id));
  (DATA.hints || []).forEach(h => add("hint", null, h.brand, "", null, h.venues));
  LABEL_IDX = idx;
  return idx;
}

const KIND_ORDER = {beer: 0, listed: 1, brewery: 2, hint: 3};

function labelSearch(q){
  const toks = fold(q).split(/\s+/).filter(t => t.length >= 2);
  if (!toks.length) return [];
  const hits = [];
  for (const it of labelIndex()) {
    if (!toks.every(t => it.k.indexOf(t) >= 0)) continue;
    const head = fold(it.label).startsWith(toks[0]) ? 0 : 1;
    hits.push([head, KIND_ORDER[it.kind], it.label.length, it]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  return hits.slice(0, 8).map(h => h[3]);
}

const KIND_WHY = {beer: "full page", listed: "catalogue line",
                  brewery: "brewery", hint: "unconfirmed mark"};

function labelResults(q){
  const box = $("#label-out");
  const hits = labelSearch(q);
  if (!q.trim()) { box.innerHTML = ""; return; }
  if (!hits.length) {
    box.innerHTML = `<p class="note" style="border:0;padding:0;margin-top:10px">${
      T("Nothing in the atlas reads like that. Try the brewery name instead — it is usually the biggest word on the label.")}</p>`;
    return;
  }
  box.innerHTML = `<div class="bottles" style="margin-top:12px">${hits.map((h, i) => `
    <button class="bottle" data-hit="${i}">
      <span class="n">${esc(h.label)}</span>
      <span class="m">${T(KIND_WHY[h.kind])}${h.brewery && brById[h.brewery] && h.kind !== "brewery"
        ? " · " + esc(brById[h.brewery].name) : ""}</span>
    </button>`).join("")}</div>`;
  box.querySelectorAll("[data-hit]").forEach(b => {
    b.onclick = () => {

let camStream = null;
async function scanCamera(){
  const out = $("#scan-note"), vid = $("#cam");
  if (!("BarcodeDetector" in window)) {
    out.textContent = T("This browser cannot read barcodes. Type the digits instead.");
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
  } catch (e) {
    out.textContent = T("No camera here. Type the digits under the barcode instead.");
    return;
  }
  vid.hidden = false; vid.srcObject = camStream; await vid.play();
  out.textContent = T("Point the camera at the barcode.");
  const det = new BarcodeDetector({formats: ["ean_13", "ean_8", "upc_a"]});
  const tick = async () => {
    if (!camStream) return;
    try {
      const found = await det.detect(vid);
      if (found.length) {
        const code = found[0].rawValue;
        stopCamera(); out.textContent = T("Barcode read:") + " " + code;
        scanAnswer(code); return;
      }
    } catch (e) {}
    requestAnimationFrame(tick);
  };
  tick();
}
function stopCamera(){
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null;
  const v = $("#cam"); if (v) { v.hidden = true; v.srcObject = null; }
}

/* ── router ──────────────────────────────────────────────────────────── */
function route(){
  let h = location.hash && location.hash !== "#/" ? location.hash : "#/home";
  const lm = h.match(/^#\/(en|cs)\b(.*)$/);
  if (lm) { LANG = lm[1]; h = "#" + (lm[2] || "/home"); }
  document.querySelectorAll("[data-lang]").forEach(x =>
    x.toggleAttribute("aria-current", x.dataset.lang === LANG));
  document.querySelectorAll("[data-i18n]").forEach(x => x.textContent = T(x.dataset.i18n));
  document.documentElement.lang = LANG;
  const [, kind, id] = h.split("/");
  document.querySelectorAll(".nav button").forEach(b =>
    b.toggleAttribute("aria-current", b.dataset.go === "#/" + kind + "s" || b.dataset.go === h));
  stopCamera();
  if (kind === "home" || !kind) homePage();
  else if (kind === "find") finderPage();
  else if (kind === "beers") beersPage();
  else if (kind === "listed") listedPage(id);
  else if (kind === "scan") scanPage();
  else if (kind === "breweries") breweriesPage();
  else if (kind === "brewery") breweryPage(id);
  else if (kind === "venues") venuesPage();
  else if (kind === "ordering") orderingPage();
  else if (kind === "brewing") brewingPage();
  else if (kind === "correct") correctPage();
  else beerPage(id);
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { location.hash = "/" + LANG + go.dataset.go.slice(1); return; }
  const lg = e.target.closest("[data-lang]");
  if (lg) { setLang(lg.dataset.lang); return; }
  const a = e.target.closest("[data-anchor]");
  if (a) {
    anchorId = a.dataset.anchor;
    document.querySelectorAll("[data-anchor]").forEach(x => x.setAttribute("aria-pressed", x === a));
    runMatch();
  }
  if (e.target.id === "reset") {
    deltas = {};
    document.querySelectorAll("#sliders input").forEach(i => {
      i.value = 0; $("#v-" + i.dataset.ax).textContent = (LANG==="cs"?"beze změny":"unchanged");
    });
    runMatch();
  }
});
document.addEventListener("input", e => {
  const ax = e.target.dataset && e.target.dataset.ax;
  if (!ax) return;
  deltas[ax] = +e.target.value;
  $("#v-" + ax).textContent = deltas[ax] ? deltaWord(ax, deltas[ax], 3) : (LANG==="cs"?"beze změny":"unchanged");
  runMatch();
});

function paintCoaster(fresh){
  const c = document.querySelector(".coaster"); if(!c) return;
  const id = c.dataset.beer, v = VOTES[id] || {};
  const n = v.up || 0;
  c.querySelector("[data-cnt]").textContent = n;
  let h = "";
  for (let i = 0; i < Math.min(n, 25); i++) {
    const cls = [(i + 1) % 5 === 0 ? "five" : "", fresh && i === n - 1 ? "fresh" : ""].filter(Boolean).join(" ");
    h += "<i" + (cls ? ' class="' + cls + '"' : "") + "></i>";
  }
  c.querySelector("[data-marks]").innerHTML = h ||
    '<span class="none">' + T("your strokes go here") + '</span>';
  const pr = c.querySelector("[data-prompt]");
  if (pr) pr.innerHTML = n === 0
        ? (LANG === "cs" ? 'Chutnalo? <em>Udělejte čárku.</em>' : 'Liked it? <em>${T("Mark it down.")}</em>')
        : n === 1
        ? (LANG === "cs" ? 'Jedna je doma. <em>Dáte další?</em>' : 'One down. <em>Had another?</em>')
        : (LANG === "cs" ? 'To je ' + n + '. <em>Počítáme dál.</em>'
                         : 'That is ' + n + '. <em>Keep counting.</em>');
  const fill = c.querySelector("[data-beer-fill]");
  if (fill) fill.style.transform = "scaleY(" + Math.min(0.1 + n * 0.075, 1) + ")";
  c.querySelector('[data-vote="down"]').setAttribute("aria-pressed", !!v.down);
}

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-vote]"); if(!btn) return;
  const c = btn.closest(".coaster"), id = c.dataset.beer;
  const v = VOTES[id] = VOTES[id] || {};
  if (btn.dataset.vote === "up") { v.up = (v.up || 0) + 1; v.down = 0; }
  else { v.down = v.down ? 0 : 1; if (v.down) v.up = 0; }
  saveVotes(); paintCoaster(btn.dataset.vote === "up");
});

const _route = route;
route = function(){ _route(); paintCoaster(); };
addEventListener("hashchange", paintCoaster);

route();
